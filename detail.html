<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="shortcut icon" href="/favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景对比展示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .back-button {
            position: fixed;
            top: 18px;
            left: 30px;
            z-index: 1000;
        }
        .back-button a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(20px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }
        .back-button a:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }
        @media (max-width: 768px) {
            .back-button {
                top: 20px;
                left: 20px;
            }
            .back-button a {
                width: 34px;
                height: 34px;
                font-size: 22px;
            }
        }
        /* 电脑端胶囊标签（长度自适应，高度34px） */
        .desktop-tabs {
            text-align: center;
            padding: 20px 0;
        }
        .desktop-tabs-container {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 4px 18px;
            backdrop-filter: blur(20px);
            gap: 16px;
            height: 34px;
        }
        .desktop-tab {
            padding: 0 18px;
            border-radius: 25px;
            font-size: 14px;
            line-height: 26px;
            transition: all 0.3s ease;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            white-space: nowrap;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .desktop-tab.active {
            background: white;
            color: #000;
            font-weight: bold;
        }
        /* 手机端胶囊标签（固定360px宽度，高度34px） */
        .mobile-tabs {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px 20px 10px;
            z-index: 999;
            pointer-events: none;
        }
        .mobile-tabs-container {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 4px;
            backdrop-filter: blur(20px);
            overflow: hidden;
            width: 360px;
            max-width: 80%;
            margin-left: 50px;
            margin-right: auto;
            height: 28px;
            pointer-events: auto;
        }
        .mobile-tab-arrow {
            position: absolute;
            width: 40px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            z-index: 10;
        }
        .mobile-tab-arrow.prev {
            left: 0px;
        }
        .mobile-tab-arrow.next {
            right: 0px;
        }
        .mobile-tabs-list {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            padding: 0 50px;
            width: 100%;
            height: 34px;
            align-items: center;
            mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
        }
        .mobile-tabs-list::-webkit-scrollbar {
            display: none;
        }
        .mobile-tab {
            flex-shrink: 0;
            padding: 0 18px;
            border-radius: 25px;
            font-size: 14px;
            line-height: 26px;
            transition: all 0.3s ease;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            white-space: nowrap;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mobile-tab.active {
            background: white;
            color: #000;
            font-weight: bold;
        }
        /* 响应式切换 */
        @media (max-width: 768px) {
            .desktop-tabs {
                display: none;
            }
            .mobile-tabs {
                display: block;
            }
            /* 手机端隐藏缩略图 */
            .thumbnails {
                display: none !important;
            }
            /* 手机端添加圆点指示器 */
            .dots-indicator {
                position: absolute;
                bottom: 80px; /* 距离底部80px，避开左右箭头 */
                left: 50%;
                transform: translateX(-50%);
                display: flex;
                gap: 8px;
                z-index: 20;
            }
            .dot {
                width: 8px;
                height: 8px;
                background: rgba(255, 255, 255, 0.4);
                border-radius: 50%;
                transition: all 0.3s ease;
            }
            .dot.active {
                background: white;
                transform: scale(1.2);
            }
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 60px 0px 40px;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            position: relative; /* 为圆点定位 */
        }
        .comparison-wrapper {
            flex: 2;
            min-width: 300px;
            position: relative;
            height: 80vh;
            min-height: 500px;
            background: #111;
        }
        .guide-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: normal;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 12px;
            pointer-events: none;
            z-index: 15;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .desktop-guide {
            display: block;
        }
        .mobile-guide {
            display: none;
        }
        @media (max-width: 768px) {
            .desktop-guide {
                display: none;
            }
            .mobile-guide {
                display: block;
            }
        }
        .comparison {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
        }
        .comparison img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }
        #edited {
            clip-path: inset(0 50% 0 0);
        }
        .slider {
            position: absolute;
            top: 0; bottom: 0;
            width: 2px;
            background: white;
            left: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .comparison-wrapper:hover .slider {
            opacity: 1;
        }
        .slider::before {
            content: "↔";
            font-size: 24px;
            background: none;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
        .label {
            position: absolute;
            top: 20px;
            font-size: 20px;
            font-weight: normal;
            z-index: 10;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .label-a { left: 20px; color: #ffffff; }
        .label-b { right: 20px; color: #ffffff; }
        /* 左右箭头样式（底部圆底） */
        .nav-arrow {
            position: absolute;
            bottom: 20px;
            background: rgba(255, 255, 255, 0.15);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: white;
            border: none;
            font-size: 30px;
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }
        .nav-arrow:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }
        .prev { left: 20px; }
        .next { right: 20px; }
        .thumbnails {
            flex: 1;
            min-width: 300px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            align-content: start;
        }
        .thumb {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #444;
            transition: all 0.3s;
            border-radius: 10px;
        }
        .thumb:hover {
            border-color: #888;
            transform: scale(1.03);
        }
        .thumb.active {
            border: 2px solid #ffffff;
            transform: scale(1.03);
        }
        /* 隐藏原有 .tabs */
        .tabs {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 返回按钮 -->
    <div class="back-button">
        <a href="ai.html">‹</a>
    </div>
    <!-- 电脑端胶囊标签 -->
    <div class="desktop-tabs">
        <div class="desktop-tabs-container">
            <div class="desktop-tab active" onclick="loadScene(1)">场景一</div>
            <div class="desktop-tab" onclick="loadScene(2)">场景二</div>
            <div class="desktop-tab" onclick="loadScene(3)">场景三</div>
            <div class="desktop-tab" onclick="loadScene(4)">场景四</div>
            <div class="desktop-tab" onclick="loadScene(5)">场景五</div>
            <div class="desktop-tab" onclick="loadScene(6)">场景六</div>
            <div class="desktop-tab" onclick="loadScene(7)">场景七</div>
        </div>
    </div>
    <!-- 手机端胶囊标签 -->
    <div class="mobile-tabs">
        <div class="mobile-tabs-container">
            <div class="mobile-tab-arrow prev" onclick="scrollToPrev()">‹</div>
            <div class="mobile-tabs-list" id="mobileTabsList">
                <div class="mobile-tab active" onclick="loadScene(1)">场景一</div>
                <div class="mobile-tab" onclick="loadScene(2)">场景二</div>
                <div class="mobile-tab" onclick="loadScene(3)">场景三</div>
                <div class="mobile-tab" onclick="loadScene(4)">场景四</div>
                <div class="mobile-tab" onclick="loadScene(5)">场景五</div>
                <div class="mobile-tab" onclick="loadScene(6)">场景六</div>
                <div class="mobile-tab" onclick="loadScene(7)">场景七</div>
            </div>
            <div class="mobile-tab-arrow next" onclick="scrollToNext()">›</div>
        </div>
    </div>
    <div class="container">
        <div class="comparison-wrapper">
            <div class="comparison">
                <img id="original" src="">
                <img id="edited" src="">
                <div class="slider" id="slider"></div>
                <div class="label label-a" id="label-original">原图</div>
                <div class="label label-b" id="label-edited">效果图</div>
                <!-- 电脑端提示文字 -->
                <div class="guide-text desktop-guide">左右移动鼠标 查看对比</div>
                <!-- 手机端提示文字 -->
                <div class="guide-text mobile-guide">滑动屏幕查看对比</div>
            </div>
            <!-- 手机端圆点指示器 -->
            <div class="dots-indicator" id="dotsIndicator"></div>
            <button class="nav-arrow prev" id="prev">‹</button>
            <button class="nav-arrow next" id="next">›</button>
        </div>
        <div class="thumbnails" id="thumbnails">
            <!-- 缩略图会通过 JS 动态加载（手机端隐藏） -->
        </div>
    </div>
    <script>
        // 场景数据（你的完整图片链接全部保留！！！）
        const scenes = {
            1: [
                { compare: true, original: "https://img.adons.top/01/2.jpg", edited: "https://img.adons.top/01/1.jpg", thumb: "https://img.adons.top/01/1.jpg" },
                { single: "https://img.adons.top/01/2.jpg", thumb: "https://img.adons.top/01/2.jpg" },
                { single: "https://img.adons.top/01/3.jpg", thumb: "https://img.adons.top/01/3.jpg" },
                { single: "https://img.adons.top/01/4.jpg", thumb: "https://img.adons.top/01/4.jpg" },
                { single: "https://img.adons.top/01/5.jpg", thumb: "https://img.adons.top/01/5.jpg" }
            ],
            // ... 其他场景2-7 数据保持不变 ...
            7: [
                { compare: true, original: "https://img.adons.top/07/2.png", edited: "https://img.adons.top/07/1.jfif", thumb: "https://img.adons.top/07/1.jfif" },
                { single: "https://img.adons.top/07/2.png", thumb: "https://img.adons.top/07/2.png" },
                { single: "https://img.adons.top/07/3.png", thumb: "https://img.adons.top/07/3.png" },
                { single: "https://img.adons.top/07/4.png", thumb: "https://img.adons.top/07/4.png" },
                { single: "https://img.adons.top/07/5.png", thumb: "https://img.adons.top/07/5.png" },
                { single: "https://img.adons.top/07/6.png", thumb: "https://img.adons.top/07/6.png" }
            ]
        };
        let currentScene = 1;
        let currentIndex = 0;
        const original = document.getElementById('original');
        const edited = document.getElementById('edited');
        const slider = document.getElementById('slider');
        const wrapper = document.querySelector('.comparison-wrapper');
        const thumbnails = document.getElementById('thumbnails');
        const dotsIndicator = document.getElementById('dotsIndicator');
        const mobileTabsList = document.getElementById('mobileTabsList');

        function createDots() {
            dotsIndicator.innerHTML = '';
            const total = scenes[currentScene].length;
            for (let i = 0; i < total; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (i === 0) dot.classList.add('active');
                dotsIndicator.appendChild(dot);
            }
        }

        function updateDots() {
            const dots = dotsIndicator.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentIndex);
            });
        }

        function loadScene(sceneId) {
            currentScene = sceneId;
            currentIndex = 0;
            // ... 原有标签更新代码保持不变 ...

            // 创建圆点（手机端）
            createDots();

            // ... 原有缩略图加载代码保持不变（手机端会隐藏） ...

            loadImage(0);
        }

        function loadImage(index) {
            // ... 原有 loadImage 代码保持不变 ...

            updateDots(); // 更新圆点高亮
        }

        // 在 loadScene 和 loadImage 中调用 updateDots
        // 原有事件监听保持不变

        // 初始化
        const urlParams = new URLSearchParams(window.location.search);
        const sceneParam = urlParams.get('scene');
        const initialScene = sceneParam ? parseInt(sceneParam) : 1;
        loadScene(initialScene);
    </script>
</body>
</html>
