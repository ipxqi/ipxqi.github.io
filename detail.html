<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="shortcut icon" href="/favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景对比展示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .tabs {
            text-align: center;
            padding: 20px 0;
        }
        .tabs button {
            background: #333;
            color: #fff;
            border: none;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
        }
        .tabs button.active {
            background: #555;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 0 20px 40px;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .comparison-wrapper {
            flex: 2;
            min-width: 300px;
            position: relative;
            height: 80vh;
            min-height: 500px;
            background: #111;
        }
        .guide-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: normal;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 12px;
            pointer-events: none;
            z-index: 15;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .comparison {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
        }
        .comparison img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }
        #edited {
            clip-path: inset(0 50% 0 0);
        }
        .slider {
            position: absolute;
            top: 0; bottom: 0;
            width: 2px;
            background: white;
            left: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .comparison-wrapper:hover .slider {
            opacity: 1;
        }
        .slider::before {
            content: "↔";
            font-size: 24px;
            background: none;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
        .label {
            position: absolute;
            top: 20px;
            font-size: 20px;
            font-weight: normal;
            z-index: 10;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .label-a { left: 20px; color: #ffffff; }
        .label-b { right: 20px; color: #ffffff; }
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            color: white;
            border: none;
            font-size: 40px;
            cursor: pointer;
            z-index: 20;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .prev { left: 20px; }
        .next { right: 20px; }
        .thumbnails {
            flex: 1;
            min-width: 300px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            align-content: start;
        }
        .thumb {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #444;
            transition: all 0.3s;
            border-radius: 10px;
        }
        .thumb:hover {
            border-color: #888;
            transform: scale(1.03);
        }
        .thumb.active {
            border: 2px solid #ffffff;
            transform: scale(1.03);
        }
        .back-button {
            position: fixed;
            top: 18px;
            left: 30px;
            z-index: 1000;
        }
        .back-button a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(20px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }
        .back-button a:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }
        @media (max-width: 768px) {
            .back-button {
                top: 20px;
                left: 20px;
            }
            .back-button a {
                width: 34px;
                height: 34px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <!-- 返回按钮 -->
    <div class="back-button">
        <a href="index.html">‹</a>
    </div>

    <!-- 场景切换标签（带链接） -->
    <div class="tabs">
        <button class="active" onclick="loadScene(1)">场景一</button>
        <button onclick="loadScene(2)">场景二</button>
        <button onclick="loadScene(3)">场景三</button>
    </div>

    <div class="container">
        <div class="comparison-wrapper">
            <div class="comparison">
                <img id="original" src="">
                <img id="edited" src="">
                <div class="slider" id="slider"></div>
                <div class="label label-a" id="label-original">原图</div>
                <div class="label label-b" id="label-edited">效果图</div>
                <div class="guide-text">左右移动鼠标 查看对比</div>
            </div>
            <button class="nav-arrow prev" id="prev">‹</button>
            <button class="nav-arrow next" id="next">›</button>
        </div>
        <div class="thumbnails" id="thumbnails">
            <!-- 缩略图会通过 JS 动态加载 -->
        </div>
    </div>

    <script>
        // 场景数据（你可以根据需要添加更多场景）
        const scenes = {
            1: [ // 场景一
                { compare: true, original: "https://img.adons.top/01/1.jpg", edited: "https://img.adons.top/01/0.jpg", thumb: "https://img.adons.top/01/0.jpg" },
                { single: "https://img.adons.top/01/1.jpg", thumb: "https://img.adons.top/01/1.jpg" },
                { single: "https://img.adons.top/01/3.jpg", thumb: "https://img.adons.top/01/3.jpg" },
                { single: "https://img.adons.top/01/4.jpg", thumb: "https://img.adons.top/01/4.jpg" },
                { single: "https://img.adons.top/01/5.jpg", thumb: "https://img.adons.top/01/5.jpg" }
            ],
            2: [ // 场景二
                { compare: true, original: "https://img.adons.top/02/2-2.jpg", edited: "https://img.adons.top/02/2-1.jpg", thumb: "https://img.adons.top/02/2-1.jpg" },
                { single: "https://img.adons.top/02/2-3.jpg", thumb: "https://img.adons.top/02/2-3.jpg" },
                { single: "https://img.adons.top/02/2-4.jpg", thumb: "https://img.adons.top/02/2-4.jpg" },
                { single: "https://img.adons.top/02/2-5.jpg", thumb: "https://img.adons.top/02/2-5.jpg" }
                // 添加更多
            ],
            3: [ // 场景三
                { compare: true, original: "https://img.adons.top/03/1.jpg", edited: "https://img.adons.top/03/0.jpg", thumb: "https://img.adons.top/03/0.jpg" },
                { single: "https://img.adons.top/03/2.jpg", thumb: "https://img.adons.top/03/2.jpg" }
                // 添加更多
            ]
        };

        let currentScene = 1;
        let currentIndex = 0;

        const original = document.getElementById('original');
        const edited = document.getElementById('edited');
        const slider = document.getElementById('slider');
        const wrapper = document.querySelector('.comparison-wrapper');
        const thumbnails = document.getElementById('thumbnails');
        const guideText = document.querySelector('.guide-text');

        function loadScene(sceneId) {
            currentScene = sceneId;
            currentIndex = 0;
            // 更新标签激活状态
            document.querySelectorAll('.tabs button').forEach((btn, i) => {
                btn.classList.toggle('active', i + 1 === sceneId);
            });
            // 加载缩略图
            thumbnails.innerHTML = '';
            scenes[sceneId].forEach((item, i) => {
                const img = document.createElement('img');
                img.className = 'thumb';
                img.src = item.thumb;
                if (i === 0) img.classList.add('active');
                if (item.compare) img.classList.add('thumb-compare');
                img.addEventListener('click', () => loadImage(i));
                thumbnails.appendChild(img);
            });
            loadImage(0);
        }

        function loadImage(index) {
            const item = scenes[currentScene][index];
            const isCompare = item.compare;
            if (isCompare) {
                original.src = item.original;
                edited.src = item.edited;
                original.style.display = 'block';
                edited.style.display = 'block';
                slider.style.display = 'flex';
                document.getElementById('label-original').style.opacity = '1';
                document.getElementById('label-edited').style.opacity = '1';
                guideText.style.opacity = '1';
            } else {
                original.src = item.single;
                edited.src = '';
                original.style.display = 'block';
                edited.style.display = 'none';
                slider.style.display = 'none';
                document.getElementById('label-original').style.opacity = '0';
                document.getElementById('label-edited').style.opacity = '0';
                guideText.style.opacity = '0';
            }
            document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));
            currentIndex = index;
            updateSlider(50);
        }

        function updateSlider(percent) {
            edited.style.clipPath = `inset(0 ${100 - percent}% 0 0)`;
            slider.style.left = percent + '%';
        }

        wrapper.addEventListener('mouseenter', () => {
            if (scenes[currentScene][currentIndex].compare) {
                guideText.style.opacity = '0';
            }
        });

        wrapper.addEventListener('mouseleave', () => {
            if (scenes[currentScene][currentIndex].compare) {
                guideText.style.opacity = '1';
            }
        });

        wrapper.addEventListener('mousemove', (e) => {
            if (!scenes[currentScene][currentIndex].compare) return;
            const rect = wrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            let percent = (x / rect.width) * 100;
            percent = Math.max(0, Math.min(100, percent));
            updateSlider(percent);
            if (percent < 50) {
                document.getElementById('label-original').style.opacity = '0';
                document.getElementById('label-edited').style.opacity = '1';
            } else {
                document.getElementById('label-original').style.opacity = '1';
                document.getElementById('label-edited').style.opacity = '0';
            }
        });

        wrapper.addEventListener('touchmove', (e) => {
            if (!scenes[currentScene][currentIndex].compare) return;
            e.preventDefault();
            const rect = wrapper.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left;
            let percent = (x / rect.width) * 100;
            percent = Math.max(0, Math.min(100, percent));
            updateSlider(percent);
        });

        document.getElementById('prev').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + scenes[currentScene].length) % scenes[currentScene].length;
            loadImage(currentIndex);
        });

        document.getElementById('next').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % scenes[currentScene].length;
            loadImage(currentIndex);
        });

        // 初始化场景一
        loadScene(1);
    </script>
</body>
</html>
