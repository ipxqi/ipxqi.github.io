<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="shortcut icon" href="/favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景对比展示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .back-button {
            position: fixed;
            top: 18px;
            left: 30px;
            z-index: 1000;
        }
        .back-button a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(20px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }
        .back-button a:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }
        @media (max-width: 768px) {
            .back-button {
                top: 20px;
                left: 20px;
            }
            .back-button a {
                width: 34px;
                height: 34px;
                font-size: 22px;
            }
        }
        /* 电脑端胶囊标签（全部显示，自适应长度，居中） */
        .desktop-tabs {
            text-align: center;
            padding: 20px 0;
        }
        .desktop-tabs-container {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 8px 20px;
            backdrop-filter: blur(20px);
            gap: 12px;
        }
        .desktop-tab {
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            white-space: nowrap;
        }
        .desktop-tab.active {
            background: white;
            color: #000;
            font-weight: bold;
        }

        /* 手机端焦点胶囊标签 */
        .mobile-tabs {
            display: none;
            padding: 20px 20px;
        }
        .mobile-tabs-container {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            padding: 8px;
            backdrop-filter: blur(20px);
            overflow: hidden;
            width: calc(100% - 40px);
            max-width: 600px;
            margin: 0 auto;
        }
        .mobile-tab-arrow {
            position: absolute;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            z-index: 10;
        }
        .mobile-tab-arrow.prev {
            left: 8px;
        }
        .mobile-tab-arrow.next {
            right: 8px;
        }
        .mobile-tabs-list {
            display: flex;
            gap: 12px;
            overflow-x: hidden; /* 隐藏滚动条，靠 JS 平滑滚动 */
            scroll-behavior: smooth; /* 平滑滚动动画 */
            padding: 0 40px;
            width: 100%;
        }
        .mobile-tab {
            flex-shrink: 0;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 12px;
            transition: all 0.3s ease;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            white-space: nowrap;
        }
        .mobile-tab.active {
            background: white;
            color: #000;
            font-weight: bold;
        }

        /* 响应式切换 */
        @media (max-width: 768px) {
            .desktop-tabs {
                display: none;
            }
            .mobile-tabs {
                display: block;
            }
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 0 20px 40px;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .comparison-wrapper {
            flex: 2;
            min-width: 300px;
            position: relative;
            height: 80vh;
            min-height: 500px;
            background: #111;
        }
        .guide-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: normal;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 12px;
            pointer-events: none;
            z-index: 15;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .comparison {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
        }
        .comparison img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }
        #edited {
            clip-path: inset(0 50% 0 0);
        }
        .slider {
            position: absolute;
            top: 0; bottom: 0;
            width: 2px;
            background: white;
            left: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .comparison-wrapper:hover .slider {
            opacity: 1;
        }
        .slider::before {
            content: "↔";
            font-size: 24px;
            background: none;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
        .label {
            position: absolute;
            top: 20px;
            font-size: 20px;
            font-weight: normal;
            z-index: 10;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .label-a { left: 20px; color: #ffffff; }
        .label-b { right: 20px; color: #ffffff; }
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            color: white;
            border: none;
            font-size: 40px;
            cursor: pointer;
            z-index: 20;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .prev { left: 20px; }
        .next { right: 20px; }
        .thumbnails {
            flex: 1;
            min-width: 300px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            align-content: start;
        }
        .thumb {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #444;
            transition: all 0.3s;
            border-radius: 10px;
        }
        .thumb:hover {
            border-color: #888;
            transform: scale(1.03);
        }
        .thumb.active {
            border: 2px solid #ffffff;
            transform: scale(1.03);
        }
        /* 隐藏原有 .tabs */
        .tabs {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 返回按钮 -->
    <div class="back-button">
        <a href="ai.html">‹</a>
    </div>

    <!-- 电脑端胶囊标签 -->
    <div class="desktop-tabs">
        <div class="desktop-tabs-container">
            <div class="desktop-tab active" onclick="loadScene(1)">场景一</div>
            <div class="desktop-tab" onclick="loadScene(2)">场景二</div>
            <div class="desktop-tab" onclick="loadScene(3)">场景三</div>
            <div class="desktop-tab" onclick="loadScene(4)">场景四</div>
            <div class="desktop-tab" onclick="loadScene(5)">场景五</div>
            <div class="desktop-tab" onclick="loadScene(6)">场景六</div>
            <div class="desktop-tab" onclick="loadScene(7)">场景七</div>
        </div>
    </div>

    <!-- 手机端焦点胶囊标签 -->
    <div class="mobile-tabs">
        <div class="mobile-tabs-container">
            <div class="mobile-tab-arrow prev" onclick="scrollToPrev()">‹</div>
            <div class="mobile-tabs-list" id="mobileTabsList">
                <div class="mobile-tab active" onclick="loadScene(1)">场景一</div>
                <div class="mobile-tab" onclick="loadScene(2)">场景二</div>
                <div class="mobile-tab" onclick="loadScene(3)">场景三</div>
                <div class="mobile-tab" onclick="loadScene(4)">场景四</div>
                <div class="mobile-tab" onclick="loadScene(5)">场景五</div>
                <div class="mobile-tab" onclick="loadScene(6)">场景六</div>
                <div class="mobile-tab" onclick="loadScene(7)">场景七</div>
            </div>
            <div class="mobile-tab-arrow next" onclick="scrollToNext()">›</div>
        </div>
    </div>

    <div class="container">
        <div class="comparison-wrapper">
            <div class="comparison">
                <img id="original" src="">
                <img id="edited" src="">
                <div class="slider" id="slider"></div>
                <div class="label label-a" id="label-original">原图</div>
                <div class="label label-b" id="label-edited">效果图</div>
                <div class="guide-text">左右移动鼠标 查看对比</div>
            </div>
            <button class="nav-arrow prev" id="prev">‹</button>
            <button class="nav-arrow next" id="next">›</button>
        </div>
        <div class="thumbnails" id="thumbnails">
            <!-- 缩略图会通过 JS 动态加载 -->
        </div>
    </div>

    <script>
        const scenes = { /* 你的7个场景数据保持不变 */ };

        let currentScene = 1;
        let currentIndex = 0;

        const original = document.getElementById('original');
        const edited = document.getElementById('edited');
        const slider = document.getElementById('slider');
        const wrapper = document.querySelector('.comparison-wrapper');
        const thumbnails = document.getElementById('thumbnails');
        const guideText = document.querySelector('.guide-text');
        const mobileTabsList = document.getElementById('mobileTabsList');

        function loadScene(sceneId) {
            currentScene = sceneId;
            currentIndex = 0;

            // 更新电脑端标签
            document.querySelectorAll('.desktop-tab').forEach((tab, i) => {
                tab.classList.toggle('active', i + 1 === sceneId);
            });

            // 更新手机端标签
            document.querySelectorAll('.mobile-tab').forEach((tab, i) => {
                tab.classList.toggle('active', i + 1 === sceneId);
            });

            // 手机端平滑滚动到选中标签居中
            const activeTab = mobileTabsList.querySelector('.mobile-tab.active');
            if (activeTab) {
                activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }

            // 加载缩略图和图片（保持原有逻辑）
            thumbnails.innerHTML = '';
            scenes[sceneId].forEach((item, i) => {
                const img = document.createElement('img');
                img.className = 'thumb';
                img.src = item.thumb;
                if (i === 0) img.classList.add('active');
                if (item.compare) img.classList.add('thumb-compare');
                img.addEventListener('click', () => loadImage(i));
                thumbnails.appendChild(img);
            });
            loadImage(0);
        }

        // 你的 loadImage, updateSlider 等函数保持不变...

        // 左右箭头点击滚动到上/下一个标签并选中
        function scrollToPrev() {
            const tabs = mobileTabsList.querySelectorAll('.mobile-tab');
            let newScene = currentScene - 1;
            if (newScene < 1) newScene = tabs.length;
            loadScene(newScene);
        }

        function scrollToNext() {
            const tabs = mobileTabsList.querySelectorAll('.mobile-tab');
            let newScene = currentScene + 1;
            if (newScene > tabs.length) newScene = 1;
            loadScene(newScene);
        }

        // 读取 URL 参数 scene
        const urlParams = new URLSearchParams(window.location.search);
        const sceneParam = urlParams.get('scene');
        const initialScene = sceneParam ? parseInt(sceneParam) : 1;
        loadScene(initialScene);
    </script>
</body>
</html>
