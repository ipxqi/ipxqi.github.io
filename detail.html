<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="shortcut icon" href="/favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>场景对比展示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .back-button {
            position: fixed;
            top: 18px;
            left: 30px;
            z-index: 1000;
        }
        .back-button a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: 600;
            text-decoration: none;
            backdrop-filter: blur(20px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.37);
            transition: all 0.3s ease;
        }
        .back-button a:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }
        @media (max-width: 768px) {
            .back-button {
                top: 20px;
                left: 20px;
            }
            .back-button a {
                width: 34px;
                height: 34px;
                font-size: 22px;
            }
        }
        /* 电脑端胶囊标签（长度自适应，高度34px） */
        .desktop-tabs {
            text-align: center;
            padding: 20px 0;
        }
        .desktop-tabs-container {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.12); /* 和返回箭头一样 */
            border-radius: 30px;
            padding: 4px 18px;
            backdrop-filter: blur(20px);
            gap: 16px;
            height: 34px; /* 高度再小一点 */
        }
        .desktop-tab {
            padding: 0 18px;
            border-radius: 25px;
            font-size: 14px;
            line-height: 26px; /* 垂直完美居中 */
            transition: all 0.3s ease;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            white-space: nowrap;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .desktop-tab.active {
            background: white;
            color: #000;
            font-weight: bold;
        }

        /* 手机端胶囊标签（固定360px宽度，高度34px） */
        .mobile-tabs {
            display: none;
            padding: 20px 20px;
        }
        .mobile-tabs-container {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.12); /* 和返回箭头一样 */
            border-radius: 30px;
            padding: 4px;
            backdrop-filter: blur(20px);
            overflow: hidden;
            width: 360px;
            max-width: 100%;
            margin: 0 auto;
            height: 28px; /* 高度再小一点 */
        }
        .mobile-tab-arrow {
            position: absolute;
            width: 40px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            z-index: 10;
        }
        .mobile-tab-arrow.prev {
            left: 8px;
        }
        .mobile-tab-arrow.next {
            right: 8px;
        }
        .mobile-tabs-list {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            padding: 0 50px;
            width: 100%;
            height: 34px;
            align-items: center;
            mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
        }
        .mobile-tabs-list::-webkit-scrollbar {
            display: none;
        }
        .mobile-tab {
            flex-shrink: 0;
            padding: 0 18px;
            border-radius: 25px;
            font-size: 14px;
            line-height: 26px; /* 垂直完美居中 */
            transition: all 0.3s ease;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            white-space: nowrap;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mobile-tab.active {
            background: white;
            color: #000;
            font-weight: bold;
        }

        /* 响应式切换 */
        @media (max-width: 768px) {
            .desktop-tabs {
                display: none;
            }
            .mobile-tabs {
                display: block;
            }
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            padding: 0 20px 40px;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .comparison-wrapper {
            flex: 2;
            min-width: 300px;
            position: relative;
            height: 80vh;
            min-height: 500px;
            background: #111;
        }
        .guide-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: normal;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            border-radius: 12px;
            pointer-events: none;
            z-index: 15;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        .comparison {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
        }
        .comparison img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }
        #edited {
            clip-path: inset(0 50% 0 0);
        }
        .slider {
            position: absolute;
            top: 0; bottom: 0;
            width: 2px;
            background: white;
            left: 50%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .comparison-wrapper:hover .slider {
            opacity: 1;
        }
        .slider::before {
            content: "↔";
            font-size: 24px;
            background: none;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }
        .label {
            position: absolute;
            top: 20px;
            font-size: 20px;
            font-weight: normal;
            z-index: 10;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .label-a { left: 20px; color: #ffffff; }
        .label-b { right: 20px; color: #ffffff; }
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            color: white;
            border: none;
            font-size: 40px;
            cursor: pointer;
            z-index: 20;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .prev { left: 20px; }
        .next { right: 20px; }
        .thumbnails {
            flex: 1;
            min-width: 300px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            align-content: start;
        }
        .thumb {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            cursor: pointer;
            border: 2px solid #444;
            transition: all 0.3s;
            border-radius: 10px;
        }
        .thumb:hover {
            border-color: #888;
            transform: scale(1.03);
        }
        .thumb.active {
            border: 2px solid #ffffff;
            transform: scale(1.03);
        }
        /* 隐藏原有 .tabs */
        .tabs {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 返回按钮 -->
    <div class="back-button">
        <a href="ai.html">‹</a>
    </div>

    <!-- 电脑端胶囊标签 -->
    <div class="desktop-tabs">
        <div class="desktop-tabs-container">
            <div class="desktop-tab active" onclick="loadScene(1)">场景一</div>
            <div class="desktop-tab" onclick="loadScene(2)">场景二</div>
            <div class="desktop-tab" onclick="loadScene(3)">场景三</div>
            <div class="desktop-tab" onclick="loadScene(4)">场景四</div>
            <div class="desktop-tab" onclick="loadScene(5)">场景五</div>
            <div class="desktop-tab" onclick="loadScene(6)">场景六</div>
            <div class="desktop-tab" onclick="loadScene(7)">场景七</div>
        </div>
    </div>

    <!-- 手机端胶囊标签 -->
    <div class="mobile-tabs">
        <div class="mobile-tabs-container">
            <div class="mobile-tab-arrow prev" onclick="scrollToPrev()">‹</div>
            <div class="mobile-tabs-list" id="mobileTabsList">
                <div class="mobile-tab active" onclick="loadScene(1)">场景一</div>
                <div class="mobile-tab" onclick="loadScene(2)">场景二</div>
                <div class="mobile-tab" onclick="loadScene(3)">场景三</div>
                <div class="mobile-tab" onclick="loadScene(4)">场景四</div>
                <div class="mobile-tab" onclick="loadScene(5)">场景五</div>
                <div class="mobile-tab" onclick="loadScene(6)">场景六</div>
                <div class="mobile-tab" onclick="loadScene(7)">场景七</div>
            </div>
            <div class="mobile-tab-arrow next" onclick="scrollToNext()">›</div>
        </div>
    </div>

    <div class="container">
        <div class="comparison-wrapper">
            <div class="comparison">
                <img id="original" src="">
                <img id="edited" src="">
                <div class="slider" id="slider"></div>
                <div class="label label-a" id="label-original">原图</div>
                <div class="label label-b" id="label-edited">效果图</div>
                <div class="guide-text">左右移动鼠标 查看对比</div>
            </div>
            <button class="nav-arrow prev" id="prev">‹</button>
            <button class="nav-arrow next" id="next">›</button>
        </div>
        <div class="thumbnails" id="thumbnails">
            <!-- 缩略图会通过 JS 动态加载 -->
        </div>
    </div>

    <script>
        // 场景数据（你的完整图片链接全部保留！！！）
        const scenes = {
            1: [ // 场景一
                { compare: true, original: "https://img.adons.top/01/1.jpg", edited: "https://img.adons.top/01/0.jpg", thumb: "https://img.adons.top/01/0.jpg" },
                { single: "https://img.adons.top/01/1.jpg", thumb: "https://img.adons.top/01/1.jpg" },
                { single: "https://img.adons.top/01/3.jpg", thumb: "https://img.adons.top/01/3.jpg" },
                { single: "https://img.adons.top/01/4.jpg", thumb: "https://img.adons.top/01/4.jpg" },
                { single: "https://img.adons.top/01/5.jpg", thumb: "https://img.adons.top/01/5.jpg" }
            ],
            2: [ // 场景二
                { compare: true, original: "https://img.adons.top/02/2-2.jpg", edited: "https://img.adons.top/02/2-1.jpg", thumb: "https://img.adons.top/02/2-1.jpg" },
                { single: "https://img.adons.top/02/2-2.jpg", thumb: "https://img.adons.top/02/2-2.jpg" },
                { single: "https://img.adons.top/02/2-3.jpg", thumb: "https://img.adons.top/02/2-3.jpg" },
                { single: "https://img.adons.top/02/2-4.jpg", thumb: "https://img.adons.top/02/2-4.jpg" },
                { single: "https://img.adons.top/02/2-5.jpg", thumb: "https://img.adons.top/02/2-5.jpg" }
            ],
            3: [ // 场景三
                { compare: true, original: "https://img.adons.top/03/2.png", edited: "https://img.adons.top/03/1.jfif", thumb: "https://img.adons.top/03/1.jfif" },
                { single: "https://img.adons.top/03/2.png", thumb: "https://img.adons.top/03/2.png" },
                { single: "https://img.adons.top/03/3.png", thumb: "https://img.adons.top/03/3.png" },
                { single: "https://img.adons.top/03/4.png", thumb: "https://img.adons.top/03/4.png" },
                { single: "https://img.adons.top/03/5.png", thumb: "https://img.adons.top/03/5.png" },
                { single: "https://img.adons.top/03/6.png", thumb: "https://img.adons.top/03/6.png" }
            ],
            4: [ // 场景四
                { compare: true, original: "https://img.adons.top/04/2.png", edited: "https://img.adons.top/04/1.jfif", thumb: "https://img.adons.top/04/1.jfif" },
                { single: "https://img.adons.top/04/2.png", thumb: "https://img.adons.top/04/2.png" },
                { single: "https://img.adons.top/04/3.png", thumb: "https://img.adons.top/04/3.png" },
                { single: "https://img.adons.top/04/4.png", thumb: "https://img.adons.top/04/4.png" },
                { single: "https://img.adons.top/04/5.png", thumb: "https://img.adons.top/04/5.png" },
                { single: "https://img.adons.top/04/6.png", thumb: "https://img.adons.top/04/6.png" }
            ],
            5: [ // 场景五
                { compare: true, original: "https://img.adons.top/05/2.png", edited: "https://img.adons.top/05/1.jfif", thumb: "https://img.adons.top/05/1.jfif" },
                { single: "https://img.adons.top/05/2.png", thumb: "https://img.adons.top/05/2.png" },
                { single: "https://img.adons.top/05/3.png", thumb: "https://img.adons.top/05/3.png" },
                { single: "https://img.adons.top/05/4.png", thumb: "https://img.adons.top/05/4.png" },
                { single: "https://img.adons.top/05/5.png", thumb: "https://img.adons.top/05/5.png" },
                { single: "https://img.adons.top/05/6.png", thumb: "https://img.adons.top/05/6.png" }
            ],
            6: [ // 场景六
                { compare: true, original: "https://img.adons.top/06/2.png", edited: "https://img.adons.top/06/1.jfif", thumb: "https://img.adons.top/06/1.jfif" },
                { single: "https://img.adons.top/06/2.png", thumb: "https://img.adons.top/06/2.png" },
                { single: "https://img.adons.top/06/3.png", thumb: "https://img.adons.top/06/3.png" },
                { single: "https://img.adons.top/06/4.png", thumb: "https://img.adons.top/06/4.png" },
                { single: "https://img.adons.top/06/5.png", thumb: "https://img.adons.top/06/5.png" },
                { single: "https://img.adons.top/06/6.png", thumb: "https://img.adons.top/06/6.png" }
            ],
            7: [ // 场景七
                { compare: true, original: "https://img.adons.top/07/2.png", edited: "https://img.adons.top/07/1.jfif", thumb: "https://img.adons.top/07/1.jfif" },
                { single: "https://img.adons.top/07/2.png", thumb: "https://img.adons.top/07/2.png" },
                { single: "https://img.adons.top/07/3.png", thumb: "https://img.adons.top/07/3.png" },
                { single: "https://img.adons.top/07/4.png", thumb: "https://img.adons.top/07/4.png" },
                { single: "https://img.adons.top/07/5.png", thumb: "https://img.adons.top/07/5.png" },
                { single: "https://img.adons.top/07/6.png", thumb: "https://img.adons.top/07/6.png" }
            ]
        };

        let currentScene = 1;
        let currentIndex = 0;

        const original = document.getElementById('original');
        const edited = document.getElementById('edited');
        const slider = document.getElementById('slider');
        const wrapper = document.querySelector('.comparison-wrapper');
        const thumbnails = document.getElementById('thumbnails');
        const guideText = document.querySelector('.guide-text');
        const mobileTabsList = document.getElementById('mobileTabsList');

        function scrollToPrev() {
            const tabs = mobileTabsList.querySelectorAll('.mobile-tab');
            let newScene = currentScene - 1;
            if (newScene < 1) newScene = tabs.length;
            loadScene(newScene);
        }

        function scrollToNext() {
            const tabs = mobileTabsList.querySelectorAll('.mobile-tab');
            let newScene = currentScene + 1;
            if (newScene > tabs.length) newScene = 1;
            loadScene(newScene);
        }

        function loadScene(sceneId) {
            currentScene = sceneId;
            currentIndex = 0;

            // 更新电脑端标签
            document.querySelectorAll('.desktop-tab').forEach((tab, i) => {
                tab.classList.toggle('active', i + 1 === sceneId);
            });

            // 更新手机端标签
            document.querySelectorAll('.mobile-tab').forEach((tab, i) => {
                tab.classList.toggle('active', i + 1 === sceneId);
            });

            // 手机端平滑滚动到选中标签居中
            const activeTab = mobileTabsList.querySelector('.mobile-tab.active');
            if (activeTab) {
                activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }

            // 加载缩略图
            thumbnails.innerHTML = '';
            scenes[sceneId].forEach((item, i) => {
                const img = document.createElement('img');
                img.className = 'thumb';
                img.src = item.thumb;
                if (i === 0) img.classList.add('active');
                if (item.compare) img.classList.add('thumb-compare');
                img.addEventListener('click', () => loadImage(i));
                thumbnails.appendChild(img);
            });
            loadImage(0);
        }

        function loadImage(index) {
            const item = scenes[currentScene][index];
            const isCompare = item.compare;
            if (isCompare) {
                original.src = item.original;
                edited.src = item.edited;
                original.style.display = 'block';
                edited.style.display = 'block';
                slider.style.display = 'flex';
                document.getElementById('label-original').style.opacity = '1';
                document.getElementById('label-edited').style.opacity = '1';
                guideText.style.opacity = '1';
            } else {
                original.src = item.single;
                edited.src = '';
                original.style.display = 'block';
                edited.style.display = 'none';
                slider.style.display = 'none';
                document.getElementById('label-original').style.opacity = '0';
                document.getElementById('label-edited').style.opacity = '0';
                guideText.style.opacity = '0';
            }
            document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('active', i === index));
            currentIndex = index;
            updateSlider(50);
        }

        function updateSlider(percent) {
            edited.style.clipPath = `inset(0 ${100 - percent}% 0 0)`;
            slider.style.left = percent + '%';
        }

        wrapper.addEventListener('mouseenter', () => {
            if (scenes[currentScene][currentIndex].compare) {
                guideText.style.opacity = '0';
            }
        });

        wrapper.addEventListener('mouseleave', () => {
            if (scenes[currentScene][currentIndex].compare) {
                guideText.style.opacity = '1';
            }
        });

        wrapper.addEventListener('mousemove', (e) => {
            if (!scenes[currentScene][currentIndex].compare) return;
            const rect = wrapper.getBoundingClientRect();
            const x = e.clientX - rect.left;
            let percent = (x / rect.width) * 100;
            percent = Math.max(0, Math.min(100, percent));
            updateSlider(percent);
            if (percent < 50) {
                document.getElementById('label-original').style.opacity = '0';
                document.getElementById('label-edited').style.opacity = '1';
            } else {
                document.getElementById('label-original').style.opacity = '1';
                document.getElementById('label-edited').style.opacity = '0';
            }
        });

        wrapper.addEventListener('touchmove', (e) => {
            if (!scenes[currentScene][currentIndex].compare) return;
            e.preventDefault();
            const rect = wrapper.getBoundingClientRect();
            const x = e.touches[0].clientX - rect.left;
            let percent = (x / rect.width) * 100;
            percent = Math.max(0, Math.min(100, percent));
            updateSlider(percent);
        });

        document.getElementById('prev').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + scenes[currentScene].length) % scenes[currentScene].length;
            loadImage(currentIndex);
        });

        document.getElementById('next').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % scenes[currentScene].length;
            loadImage(currentIndex);
        });

        // 读取 URL 参数 scene
        const urlParams = new URLSearchParams(window.location.search);
        const sceneParam = urlParams.get('scene');
        const initialScene = sceneParam ? parseInt(sceneParam) : 1;
        loadScene(initialScene);
    </script>
</body>
</html>
