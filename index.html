<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Works</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height:100vh;
      background:linear-gradient(135deg, #0a0a15 0%, #150a15 50%, #150a0a 100%);
      color:white;
      font-family:'Helvetica Neue', Arial, sans-serif;
      overflow:hidden;
      position:relative;
    }

    nav {
      position:fixed;
      top:0; left:0; right:0;
      z-index:100;
      padding:25px 5%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:rgba(0,0,0,0.4);
      backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .logo {
      font-size:26px;
      font-weight:bold;
      letter-spacing:3px;
      background:linear-gradient(90deg, #ff6b6b, #ff8e53, #ffd166);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .nav-links {
      display:flex;
      gap:40px;
      font-size:15px;
    }
    .nav-links a {
      color:rgba(255,255,255,0.8);
      text-decoration:none;
      transition:0.4s;
    }
    .nav-links a:hover {
      color:white;
      text-shadow:0 0 15px rgba(255,107,107,0.5);
    }
    .menu-icon { display:none; font-size:26px; cursor:pointer; }

    .hero {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      z-index:10;
      pointer-events:none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:40px;
      font-size:clamp(5rem, 12vw, 14rem);
      font-weight:900;
      letter-spacing:-8px;
      line-height:1;
      white-space:nowrap;
    }
    .hero span {
      background:linear-gradient(90deg, #ffffff, #e0e0e0, #ffffff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-size:200% auto;
      animation:shine 6s linear infinite;
      transition:transform 1.4s cubic-bezier(0.25,0.46,0.45,0.94);
      text-shadow:0 0 30px rgba(255,255,255,0.3);
    }
    .hero .left { transform:translateX(0); }
    .hero .right { transform:translateX(0); }

    .gallery-container {
      position:absolute;
      top:0;
      left:50%;
      transform:translateX(-50%);
      width:100%;
      height:100%;
      max-width:1600px;
      pointer-events:none;
      z-index:5;
    }
    .gallery {
      position:relative;
      width:100%;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      perspective:1400px;
    }
    .card {
      position:absolute;
      width:300px;
      height:400px;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 25px 70px rgba(0,0,0,0.7);
      background:#111;
      pointer-events:auto;
      border:1px solid rgba(255,255,255,0.07);
      transform-origin:50% 140%;
      transform-style:preserve-3d;
    }
    .card img {
      width:100%;
      height:100%;
      object-fit:cover;
      filter:brightness(0.96);
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Vertora</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Service</a>
      <a href="#">Blog</a>
      <a href="#">Portfolio</a>
      <a href="#">Contact</a>
    </div>
    <div class="menu-icon">☰</div>
  </nav>

  <div class="hero">
    <span class="left">Personal</span>
    <span class="right">works</span>
  </div>

  <div class="gallery-container">
    <div class="gallery">
      <div class="card"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=800" alt=""></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1553356084-58ef4a67b2a7?w=800" alt=""></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1511671782779-cb56e135bd67?w=800" alt=""></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1557683316-973673baf926?w=800" alt=""></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1557683311-e973673baf926?w=800" alt=""></div>
    </div>
  </div>

  <script>
    const gallery = document.querySelector('.gallery');
    const hero = document.querySelector('.hero');
    const cards = document.querySelectorAll('.card');

    function forceReset() {
      cards.forEach(card => {
        card.style.transition = 'none';
        card.style.opacity = '0';
        card.style.transform = 'translateY(-180vh) translateX(0) rotate(0deg) scale(0.85)';
        card.offsetHeight;
      });
      hero.style.transition = 'none';
      hero.classList.remove('expand-title');
      hero.offsetHeight;
      hero.style.transition = '';
      gallery.classList.remove('expand', 'retract', 'exit-up');
    }

    function startAnimation() {
      forceReset();

      // 阶段1: 照片插入 + 标题分开
      setTimeout(() => {
        cards.forEach((card, index) => {
          setTimeout(() => {
            card.style.transition = 'all 1.2s cubic-bezier(0.34, 0.16, 0.3, 1)';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0) translateX(0) rotate(0deg) scale(1)';
          }, index * 120);  // 加快延迟，插入更连贯
        });
        hero.classList.add('expand-title');
      }, 300);

      // 阶段2: 必须等所有照片完全落地后（最后一张动画结束）才一起扇形展开
      setTimeout(() => {
        gallery.classList.add('expand');
      }, 300 + 5 * 120 + 1200);  // 插入总时间 + 额外缓冲，确保落地完成

      // 阶段3: 停留 3.5 秒（加快整体节奏）
      setTimeout(() => {
        gallery.classList.remove('expand');
        gallery.classList.add('retract');
      }, 300 + 5 * 120 + 1200 + 3500);

      // 阶段4: 收回后直接向上消失 + 标题归位
      setTimeout(() => {
        gallery.classList.remove('retract');
        gallery.classList.add('exit-up');
        hero.classList.remove('expand-title');
      }, 300 + 5 * 120 + 1200 + 3500 + 1400);  // 收回动画1.4s

      // 阶段5: 重置
      setTimeout(forceReset, 300 + 5 * 120 + 1200 + 3500 + 1400 + 1000);
    }

    startAnimation();
    setInterval(startAnimation, 13000);  // 总周期约13秒，更快节奏
  </script>
</body>
</html>
