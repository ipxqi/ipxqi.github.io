<html lang="zh-CN">

    </script>

    <script>
        const frag = ` [你的 frag shader 代码保持不变，复制粘贴原来的] `;

        const vert = ` [你的 vert shader 代码保持不变] `;

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const geometry = new THREE.PlaneGeometry(2, 2);

        const colors = ["#ff5c7a", "#8a5cff", "#00ffd1"];

        const uColorsArray = colors.map(hex => {
            const h = hex.replace('#', '');
            const r = parseInt(h.slice(0,2),16)/255;
            const g = parseInt(h.slice(2,4),16)/255;
            const b = parseInt(h.slice(4,6),16)/255;
            return new THREE.Vector3(r, g, b);
        });

        while (uColorsArray.length < 8) {
            uColorsArray.push(new THREE.Vector3(0, 0, 0));
        }

        const material = new THREE.ShaderMaterial({
            vertexShader: vert,
            fragmentShader: frag,
            uniforms: {
                uCanvas: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                uTime: { value: 0 },
                uSpeed: { value: 0.3 },
                uRot: { value: new THREE.Vector2(1, 0) },
                uColorCount: { value: colors.length },
                uColors: { value: uColorsArray },
                uTransparent: { value: 1 },
                uScale: { value: 1.2 },
                uFrequency: { value: 1.4 },
                uWarpStrength: { value: 1.2 },
                uPointer: { value: new THREE.Vector2(0, 0) },
                uMouseInfluence: { value: 0.8 },
                uParallax: { value: 0.6 },
                uNoise: { value: 0.08 }
            },
            transparent: true,
            depthWrite: false
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const clock = new THREE.Clock();
        let mouseX = 0, mouseY = 0;

        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            mouseX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouseY = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        });

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            material.uniforms.uTime.value = elapsed;
            material.uniforms.uPointer.value.set(mouseX * 0.8, mouseY * 0.8);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.uCanvas.value.set(window.innerWidth, window.innerHeight);
        });
    </script>
