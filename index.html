<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vertora - Design Studio</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height:100vh;
      background:linear-gradient(135deg, #0f0f1a 0%, #1a0f1a 50%, #1a0f0f 100%);
      color:white;
      font-family:'Helvetica Neue', Arial, sans-serif;
      overflow:hidden;
      position:relative;
    }

    nav {
      position:fixed;
      top:0; left:0; right:0;
      z-index:100;
      padding:30px 5%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:rgba(0,0,0,0.3);
      backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(255,255,255,0.08);
    }
    .logo {
      font-size:32px;
      font-weight:bold;
      letter-spacing:4px;
      background:linear-gradient(90deg, #ff6b6b, #ff8e53);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .nav-links {
      display:flex;
      gap:50px;
      font-size:17px;
    }
    .nav-links a {
      color:rgba(255,255,255,0.85);
      text-decoration:none;
      transition:0.4s;
    }
    .nav-links a:hover {
      color:white;
      text-shadow:0 0 15px rgba(255,107,107,0.6);
    }
    .menu-icon { display:none; font-size:30px; cursor:pointer; }

    .hero {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      z-index:10;
      pointer-events:none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:60px;
      font-size:clamp(6rem, 15vw, 18rem);
      font-weight:900;
      letter-spacing:-12px;
      line-height:0.9;
      white-space:nowrap;
    }
    .hero span {
      background:linear-gradient(90deg, #fff, #ddd, #fff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-size:200% auto;
      animation:shine 6s linear infinite;
      transition:transform 1.6s cubic-bezier(0.25,0.46,0.45,0.94);
      text-shadow:0 0 40px rgba(255,255,255,0.4);
    }
    .hero .left { transform:translateX(0); }
    .hero .right { transform:translateX(0); }

    .gallery-container {
      position:absolute;
      top:0; left:50%;
      transform:translateX(-50%);
      width:100%;
      height:100%;
      max-width:1600px;
      pointer-events:none;
      z-index:5;
    }
    .gallery {
      position:relative;
      width:100%;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      perspective:1600px;
    }
    .card {
      position:absolute;
      width:340px;
      height:440px;
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 40px 100px rgba(0,0,0,0.8);
      background:#111;
      pointer-events:auto;
      border:1px solid rgba(255,255,255,0.07);
      transform-origin:50% 160%;
      transform-style:preserve-3d;
    }
    .card img {
      width:100%;
      height:100%;
      object-fit:cover;
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Vertora</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Service</a>
      <a href="#">Blog</a>
      <a href="#">Portfolio</a>
      <a href="#">Contact</a>
    </div>
    <div class="menu-icon">☰</div>
  </nav>

  <div class="hero">
    <span class="left">Design</span>
    <span class="right">Studio</span>
  </div>

  <div class="gallery-container">
    <div class="gallery">
      <div class="card"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=800" alt=""></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1553356084-58ef4a67b2a7?w=800" alt=""></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1511671782779-cb56e135bd67?w=800" alt=""></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1557683316-973673baf926?w=800" alt=""></div>
      <div class="card"><img src="https://images.unsplash.com/photo-1557683311-e973673baf926?w=800" alt=""></div>
    </div>
  </div>

  <script>
    const gallery = document.querySelector('.gallery');
    const hero = document.querySelector('.hero');
    const cards = document.querySelectorAll('.card');

    function resetAll() {
      cards.forEach(card => {
        card.style.transition = 'none';
        card.style.opacity = '0';
        card.style.transform = 'translateY(-180vh) translateX(0) rotate(0deg) scale(0.85)';
        card.offsetHeight;
      });
      hero.style.transition = 'none';
      hero.classList.remove('expand-title');
      hero.offsetHeight;
      hero.style.transition = '';
    }

    function startAnimation() {
      resetAll();

      // 1. 照片插入 + 标题分开
      setTimeout(() => {
        cards.forEach((card, index) => {
          setTimeout(() => {
            card.style.transition = 'all 1.3s cubic-bezier(0.34, 0.16, 0.3, 1)';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0) translateX(0) rotate(0deg) scale(1)';
          }, index * 140);
        });
        hero.classList.add('expand-title');
      }, 300);

      // 2. 等全部落地后一起扇形展开
      setTimeout(() => {
        cards.forEach((card, index) => {
          const rotations = [-22, -11, 0, 11, 22];
          const z = [-25, -12, 0, -12, -25];
          card.style.transition = 'all 1.4s cubic-bezier(0.34, 0.16, 0.3, 1)';
          card.style.transform = `translateY(0) rotate(${rotations[index]}deg) scale(0.96) translateZ(${z[index]}px)`;
        });
      }, 300 + 5 * 140 + 800);  // 插入总时间 + 缓冲，确保落地完成

      // 3. 停留 4 秒后收回中心
      setTimeout(() => {
        cards.forEach(card => {
          card.style.transition = 'all 1.4s cubic-bezier(0.34, 0.16, 0.3, 1)';
          card.style.transform = 'translateY(0) translateX(0) rotate(0deg) scale(1)';
        });
      }, 300 + 5 * 140 + 800 + 4000);

      // 4. 收回后直接向上消失
      setTimeout(() => {
        cards.forEach(card => {
          card.style.transition = 'all 1.4s cubic-bezier(0.34, 0.16, 0.3, 1)';
          card.style.opacity = '0';
          card.style.transform = 'translateY(-180vh) translateX(0) rotate(0deg) scale(0.85)';
        });
        hero.classList.remove('expand-title');
      }, 300 + 5 * 140 + 800 + 4000 + 1400);

      // 5. 重置
      setTimeout(resetAll, 300 + 5 * 140 + 800 + 4000 + 1400 + 1000);
    }

    startAnimation();
    setInterval(startAnimation, 13000);
  </script>
</body>
</html>
