<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Works</title>
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter-tight@4.5.0/900.css" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      margin:0;
      padding:0;
      background:linear-gradient(135deg, #0a0a15 0%, #150a15 50%, #150a0a 100%);
      color:white;
      font-family:"Inter Tight", sans-serif;
      overflow-y:auto;  /* 允许向下滚动 */
      min-height:200vh;  /* 确保有滚动空间 */
    }

    nav {
      position:fixed;
      top:0; left:0; right:0;
      z-index:100;
      padding:25px 5%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:rgba(0,0,0,0.4);
      backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,0.06);
    }
    .logo {
      font-size:26px;
      font-weight:900;
      letter-spacing:3px;
      background:linear-gradient(90deg, #ff6b6b, #ff8e53, #ffd166);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .nav-links {
      display:flex;
      gap:40px;
      font-size:15px;
      font-weight:500;
    }
    .nav-links a {
      color:rgba(255,255,255,0.8);
      text-decoration:none;
      transition:0.4s;
    }
    .nav-links a:hover {
      color:white;
      text-shadow:0 0 15px rgba(255,107,107,0.5);
    }
    .menu-icon { display:none; font-size:26px; cursor:pointer; }

    .hero-section {
      height:100vh;
      position:relative;
    }

    .hero {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      z-index:10;
      pointer-events:none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:40px;
      font-size:clamp(5rem, 12vw, 14rem);
      font-weight:900;
      letter-spacing:-8px;
      line-height:1;
      white-space:nowrap;
    }
    .hero span {
      background:linear-gradient(90deg, #ffffff, #e0e0e0, #ffffff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-size:200% auto;
      animation:shine 6s linear infinite;
      transition:transform 1.4s cubic-bezier(0.25,0.46,0.45,0.94);
      text-shadow:0 0 30px rgba(255,255,255,0.3);
    }
    .hero .left { transform:translateX(0); }
    .hero .right { transform:translateX(0); }

    .sub-title {
      position:absolute;
      top:65%;
      left:50%;
      transform:translate(-50%, -50%);
      z-index:9;
      font-size:clamp(1.8rem, 5vw, 3.2rem);
      font-weight:500;
      color:rgba(255,255,255,0.7);
      letter-spacing:2px;
      white-space:nowrap;
      text-shadow:0 0 20px rgba(0,0,0,0.6);
      pointer-events:none;
    }

    .gallery-container {
      position:absolute;
      top:0;
      left:50%;
      transform:translateX(-50%);
      width:100%;
      height:100%;
      max-width:1600px;
      pointer-events:none;
      z-index:5;
    }
    .gallery {
      position:relative;
      width:100%;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      perspective:1400px;
    }
    .card {
      position:absolute;
      width:240px;
      height:320px;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,0.7);
      background:#111;
      pointer-events:auto;
      border:1px solid rgba(255,255,255,0.07);
      transform-origin:50% 140%;
      transform-style:preserve-3d;
    }
    .card img {
      width:100%;
      height:100%;
      object-fit:cover;
      filter:brightness(0.96);
    }

    /* 新增：向下滚动出现的品牌列表区 */
    .clients-section {
      min-height:100vh;
      background:#000;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:80px 5%;
      opacity:0;
      transform:translateY(60px);
      transition:opacity 1.2s ease-out, transform 1.2s ease-out;
    }
    .clients-section.visible {
      opacity:1;
      transform:translateY(0);
    }
    .clients-grid {
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:50px 80px;
      max-width:1400px;
    }
    .client-logo {
      font-size:clamp(2rem, 4.5vw, 4rem);
      font-weight:900;
      color:rgba(255,255,255,0.6);
      transition:0.4s;
      letter-spacing:1px;
      white-space:nowrap;
    }
    .client-logo:hover {
      color:white;
      transform:scale(1.1);
      text-shadow:0 0 20px rgba(255,107,107,0.4);
    }
    .client-logo.check::before {
      content:"✔ ";
      color:#ffd166;
      margin-right:8px;
    }
    .client-logo.circle::before {
      content:"○ ";
      color:#ff8e53;
      margin-right:8px;
    }
  </style>
</head>
<body>
  <div class="hero-section">
    <nav>
      <div class="logo">Vertora</div>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Service</a>
        <a href="#">Blog</a>
        <a href="#">Portfolio</a>
        <a href="#">Contact</a>
      </div>
      <div class="menu-icon">☰</div>
    </nav>

    <div class="hero">
      <span class="left">Personal</span>
      <span class="right">Works</span>
    </div>

    <div class="sub-title">个人作品集</div>

    <div class="gallery-container">
      <div class="gallery">
        <div class="card"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=800" alt=""></div>
        <div class="card"><img src="https://images.unsplash.com/photo-1553356084-58ef4a67b2a7?w=800" alt=""></div>
        <div class="card"><img src="https://images.unsplash.com/photo-1511671782779-cb56e135bd67?w=800" alt=""></div>
        <div class="card"><img src="https://images.unsplash.com/photo-1557683316-973673baf926?w=800" alt=""></div>
        <div class="card"><img src="https://images.unsplash.com/photo-1557683311-e973673baf926?w=800" alt=""></div>
      </div>
    </div>
  </div>

  <!-- 新增：向下滚动出现的品牌列表区 -->
  <section class="clients-section">
    <div class="clients-grid">
      <div class="client-logo">SAVANNAH</div>
      <div class="client-logo">oslo.</div>
      <div class="client-logo check">Basel</div>
      <div class="client-logo">Manila.</div>
      <div class="client-logo circle">Cactus</div>
      <div class="client-logo">FeatherDev</div>
      <div class="client-logo">SAVANNAH</div>
      <div class="client-logo">oslo.</div>
    </div>
  </section>

  <script>
    const gallery = document.querySelector('.gallery');
    const hero = document.querySelector('.hero');
    const cards = document.querySelectorAll('.card');
    const clientsSection = document.querySelector('.clients-section');

    function forceReset() {
      cards.forEach(card => {
        card.style.transition = 'none';
        card.style.opacity = '0';
        card.style.transform = 'translateY(-180vh) translateX(0) rotate(0deg) scale(0.85)';
        card.offsetHeight;
      });
      hero.style.transition = 'none';
      hero.classList.remove('expand-title');
      hero.offsetHeight;
      hero.style.transition = '';
    }

    function startAnimation() {
      forceReset();

      setTimeout(() => {
        cards.forEach((card, index) => {
          setTimeout(() => {
            card.style.transition = 'all 1.2s cubic-bezier(0.34, 0.16, 0.3, 1)';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0) translateX(0) rotate(0deg) scale(1)';
          }, index * 120);
        });
        hero.classList.add('expand-title');
      }, 300);

      setTimeout(() => {
        cards.forEach((card, index) => {
          const rotations = [-22, -11, 0, 11, 22];
          const z = [-25, -12, 0, -12, -25];
          card.style.transition = 'all 1.4s cubic-bezier(0.34, 0.16, 0.3, 1)';
          card.style.transform = `translateY(0) rotate(${rotations[index]}deg) scale(0.96) translateZ(${z[index]}px)`;
        });
      }, 300 + 5 * 120 + 1200 + 500);

      setTimeout(() => {
        cards.forEach(card => {
          card.style.transition = 'all 1.4s cubic-bezier(0.34, 0.16, 0.3, 1)';
          card.style.transform = 'translateY(0) translateX(0) rotate(0deg) scale(1)';
        });
      }, 300 + 5 * 120 + 1200 + 500 + 4000);

      setTimeout(() => {
        cards.forEach((card, index) => {
          setTimeout(() => {
            card.style.transition = 'all 1.2s cubic-bezier(0.34, 0.16, 0.3, 1)';
            card.style.opacity = '0';
            card.style.transform = 'translateY(-180vh) translateX(0) rotate(0deg) scale(0.85)';
          }, index * 120);
        });
        hero.classList.remove('expand-title');
      }, 300 + 5 * 120 + 1200 + 500 + 4000 + 1400);

      setTimeout(forceReset, 300 + 5 * 120 + 1200 + 500 + 4000 + 1400 + 5 * 120 + 1000);
    }

    // 品牌列表滚动出现动画
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.2 });

    observer.observe(clientsSection);

    startAnimation();
    setInterval(startAnimation, 13000);
  </script>
</body>
</html>
