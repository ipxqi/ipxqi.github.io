<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能加人物</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ff5c7a, #8a5cff, #00ffd1);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            filter: blur(0px);
            z-index: -1;
        }
        .wave {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 10%, transparent 10%);
            background-size: 50px 50px;
            animation: wave 20s linear infinite;
            opacity: 0.5;
            pointer-events: none;
        }
        .wave:nth-child(2) {
            animation-direction: reverse;
            animation-duration: 25s;
            opacity: 0.3;
        }
        .wave:nth-child(3) {
            animation-duration: 30s;
            background: radial-gradient(circle, rgba(255,92,122,0.2) 20%, transparent 20%);
            background-size: 80px 80px;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes wave {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        body:hover .background {
            animation-duration: 8s;
        }
        body:hover .wave {
            animation-duration: 10s;
        }
        .content {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 48px;
            font-weight: 600;
            margin-bottom: 20px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        p {
            font-size: 24px;
            max-width: 800px;
            line-height: 1.6;
            opacity: 0.9;
        }
        a.button {
            display: inline-block;
            margin-top: 40px;
            padding: 16px 32px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        a.button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-4px);
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <div class="content">
        <h1>AI智能加人物<br>多角度展示</h1>
        <p>专业室内设计效果图 · 无人场景快速添加真实人物<br>支持任意人数、自然姿势、多角度呈现</p>
        <a href="/ai.html" class="button">查看作品集 →</a>
    </div>
</body>
</html>
