<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能加人物</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        .background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), #ff5c7a33, #8a5cff33, #00ffd133, #000 70%);
            animation: flow 20s linear infinite;
            filter: blur(80px);
            opacity: 0.8;
            z-index: -1;
            transition: background 0.3s ease;
        }
        @keyframes flow {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
        .content { 
            position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px; 
        }
        h1 { font-size: 48px; font-weight: 600; margin-bottom: 20px; text-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        p { font-size: 24px; max-width: 800px; line-height: 1.6; opacity: 0.9; }
        a.button { display: inline-block; margin-top: 40px; padding: 16px 32px; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border-radius: 50px; color: white; text-decoration: none; font-size: 20px; font-weight: bold; box-shadow: 0 8px 32px rgba(0,0,0,0.4); transition: all 0.3s ease; }
        a.button:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-4px); }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="content">
        <h1>AI智能加人物<br>多角度展示</h1>
        <p>专业室内设计效果图 · 无人场景快速添加真实人物<br>支持任意人数、自然姿势、多角度呈现</p>
        <a href="/ai.html" class="button">查看作品集 →</a>
    </div>

    <script>
        const bg = document.querySelector('.background');
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100 + '%';
            const y = (e.clientY / window.innerHeight) * 100 + '%';
            bg.style.setProperty('--mouse-x', x);
            bg.style.setProperty('--mouse-y', y);
        });
    </script>
</body>
</html>
