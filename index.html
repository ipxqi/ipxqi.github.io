<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能加人物</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        .background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.8;
            mix-blend-mode: screen; /* 关键：颜色混合像光效流动 */
        }
        /* 5个流动球体 */
        .orb1 { width: 600px; height: 600px; background: radial-gradient(#ff5c7a, transparent); animation: float1 25s infinite linear; }
        .orb2 { width: 800px; height: 800px; background: radial-gradient(#8a5cff, transparent); animation: float2 30s infinite linear; }
        .orb3 { width: 500px; height: 500px; background: radial-gradient(#00ffd1, transparent); animation: float3 35s infinite linear; }
        .orb4 { width: 700px; height: 700px; background: radial-gradient(#ff8c00, transparent); animation: float4 28s infinite linear; }
        .orb5 { width: 600px; height: 600px; background: radial-gradient(#00ff80, transparent); animation: float5 32s infinite linear; }

        /* 鼠标跟随球体 */
        .orb-mouse { width: 400px; height: 400px; background: radial-gradient(white, transparent); opacity: 0.6; pointer-events: none; transition: transform 0.3s ease; }

        @keyframes float1 { 0% { transform: translate(0, 0); } 100% { transform: translate(100vw, 100vh); } }
        @keyframes float2 { 0% { transform: translate(100vw, 0); } 100% { transform: translate(-100vw, 100vh); } }
        @keyframes float3 { 0% { transform: translate(50vw, 100vh); } 100% { transform: translate(-50vw, -100vh); } }
        @keyframes float4 { 0% { transform: translate(-100vw, 50vh); } 100% { transform: translate(100vw, -50vh); } }
        @keyframes float5 { 0% { transform: translate(30vw, -100vh); } 100% { transform: translate(70vw, 100vh); } }

        .content { 
            position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px; 
        }
        h1 { font-size: 48px; font-weight: 600; margin-bottom: 20px; text-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        p { font-size: 24px; max-width: 800px; line-height: 1.6; opacity: 0.9; }
        a.button { display: inline-block; margin-top: 40px; padding: 16px 32px; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border-radius: 50px; color: white; text-decoration: none; font-size: 20px; font-weight: bold; box-shadow: 0 8px 32px rgba(0,0,0,0.4); transition: all 0.3s ease; }
        a.button:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-4px); }
    </style>
</head>
<body>
    <div class="background">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
        <div class="orb orb4"></div>
        <div class="orb orb5"></div>
        <div class="orb orb-mouse" id="mouse-orb"></div>
    </div>
    <div class="content">
        <h1>AI智能加人物<br>多角度展示</h1>
        <p>专业室内设计效果图 · 无人场景快速添加真实人物<br>支持任意人数、自然姿势、多角度呈现</p>
        <a href="/ai.html" class="button">查看作品集 →</a>
    </div>

    <script>
        const mouseOrb = document.getElementById('mouse-orb');
        document.addEventListener('mousemove', (e) => {
            mouseOrb.style.transform = `translate(${e.clientX - 200}px, ${e.clientY - 200}px)`;
        });
    </script>
</body>
</html>
