<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能加人物</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        .background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(60deg, #ff5c7a, #8a5cff, #00ffd1, #ff5c7a);
            background-size: 300% 300%;
            animation: gradient 20s ease infinite;
            filter: blur(1px);
            z-index: -1;
        }
        .wave1, .wave2, .wave3 {
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 15%, transparent 15%);
            background-size: 60px 60px;
            animation: wave 25s linear infinite;
            opacity: 0.4;
            pointer-events: none;
        }
        .wave2 {
            animation-duration: 30s;
            animation-direction: reverse;
            background-size: 80px 80px;
            opacity: 0.3;
        }
        .wave3 {
            animation-duration: 35s;
            background: radial-gradient(circle, rgba(138,92,255,0.2) 20%, transparent 20%);
            background-size: 100px 100px;
            opacity: 0.25;
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes wave {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }
        body:hover .background { animation-duration: 10s; }
        body:hover .wave1, body:hover .wave2, body:hover .wave3 { animation-duration: 12s; }
        .content {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        h1 { font-size: 48px; font-weight: 600; margin-bottom: 20px; text-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        p { font-size: 24px; max-width: 800px; line-height: 1.6; opacity: 0.9; }
        a.button {
            display: inline-block;
            margin-top: 40px;
            padding: 16px 32px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transition: all 0.3s ease;
        }
        a.button:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-4px); }
    </style>
</head>
<body>
    <div class="background">
        <div class="wave1"></div>
        <div class="wave2"></div>
        <div class="wave3"></div>
    </div>

    <div class="content">
        <h1>AI智能加人物<br>多角度展示</h1>
        <p>专业室内设计效果图 · 无人场景快速添加真实人物<br>支持任意人数、自然姿势、多角度呈现</p>
        <a href="/ai.html" class="button">查看作品集 →</a>
    </div>
</body>
</html>
