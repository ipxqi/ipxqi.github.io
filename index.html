<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Works</title>
  <!-- 去掉 Inter Tight CDN，使用苹果系统字体栈 -->
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      margin:0;
      padding:0;
      background:linear-gradient(135deg, #0a0a15 0%, #150a15 50%, #150a0a 100%);
      color:white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow-y:auto;
      min-height:200vh;
    }

    /* 苹果风格导航栏容器：宽度收窄 + 居中 */
    .nav-container {
      position:fixed;
      top:0; left:0; right:0;
      z-index:100;
      display:flex;
      justify-content:center;
      background:rgba(0,0,0,0.4);
      backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(255,255,255,0.06);
    }

    nav {
      width:100%;
      max-width:1200px;
      padding:10px 5%;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .logo {
      font-size:26px;
      font-weight:900;
      letter-spacing:3px;
      background:linear-gradient(90deg, #ff6b6b, #ff8e53, #ffd166);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    .nav-links {
      display:flex;
      gap:40px;
      font-size:15px;
      font-weight:500;
    }
    .nav-links a {
      color:rgba(255,255,255,0.8);
      text-decoration:none;
      transition:0.4s;
    }
    .nav-links a:hover {
      color:white;
      text-shadow:0 0 15px rgba(255,107,107,0.5);
    }
    .menu-icon { display:none; font-size:26px; cursor:pointer; }

    .hero-section {
      height:100vh;
      position:relative;
    }

    .hero {
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      z-index:10;
      pointer-events:none;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:40px;
      font-size: clamp(4.5rem, 11vw, 12rem);  /* 标题稍小一点 */
      font-weight:900;
      letter-spacing:-8px;
      line-height:1;
      white-space:nowrap;
    }
    .hero span {
      background:linear-gradient(90deg, #ffffff, #e0e0e0, #ffffff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-size:200% auto;
      animation:shine 6s linear infinite;
      transition:transform 1.4s cubic-bezier(0.25,0.46,0.45,0.94);
      text-shadow:0 0 30px rgba(255,255,255,0.3);
    }
    .hero .left { transform:translateX(0); }
    .hero .right { transform:translateX(0); }

    .sub-title {
      position:absolute;
      top:60%;
      left:65%;
      transform:translate(-50%, -50%);
      z-index:9;
      font-size:clamp(1.8rem, 5vw, 3.2rem);
      font-weight:500;
      color:rgba(255,255,255,0.7);
      letter-spacing:2px;
      white-space:nowrap;
      text-shadow:0 0 20px rgba(0,0,0,0.6);
      pointer-events:none;
    }

    .gallery-container {
      position:absolute;
      top:0;
      left:50%;
      transform:translateX(-50%);
      width:100%;
      height:100%;
      max-width:1600px;
      pointer-events:none;
      z-index:5;
    }
    .gallery {
      position:relative;
      width:100%;
      height:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      perspective:1400px;
    }
    .card {
      position:absolute;
      width:240px;
      height:320px;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 20px 60px rgba(0,0,0,0.7);
      background:#111;
      pointer-events:auto;
      border:1px solid rgba(255,255,255,0.07);
      transform-origin:50% 140%;
      transform-style:preserve-3d;
    }
    .card img {
      width:100%;
      height:100%;
      object-fit:cover;
      filter:brightness(0.96);
    }

    /* 品牌列表 + 文字区域（文字在上，滚动在下） */
    .clients-section {
      min-height:40vh;
      background:#000;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:80px 5%;
      opacity:0;
      transform:translateY(60px);
      transition:opacity 1.2s ease-out, transform 1.2s ease-out;
      gap:60px;
      position:relative;
    }
    .clients-section.visible {
      opacity:1;
      transform:translateY(0);
    }

    /* 靠右边的文字块：水平齐平，靠右移 */
    .partners-text-wrapper {
      position:absolute;
     
      top:18%;
      max-width:900px;
      text-align:left;
      z-index:10;
      pointer-events:none;
    }
    .partners-text {
      display:flex;
      align-items:baseline;
      gap:355px;
      font-size:clamp(1.8rem, 4vw, 3.5rem);
      letter-spacing: -1px;  /* 只加了这一行：字间距缩小（负值让字更紧凑） */
      line-height:1.2;
      color:white;
      text-shadow:0 0 20px rgba(0,0,0,0.7);
    }
    .main-desc {
  font-size: clamp(1.4rem, 3vw, 2.8rem) !important;
}
    .partners-text small {
      font-size:0.45em;
      font-weight:500;
      color:rgba(255,255,255,0.6);
    
      text-transform:uppercase;
      white-space:nowrap;
    }

    /* 下方滚动列表 */
    .marquee-wrapper {
      width:100%;
      
      position:relative;
    }
    .marquee-track {
      display:flex;
      white-space:nowrap;
      animation:marquee 35s linear infinite;
    }
    .marquee-item {
      flex-shrink:0;
      margin:0 30px;
      height:60px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .marquee-item img {
      height:100%;
      width:auto;
      max-width:150px;
      object-fit:contain;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
  </style>
</head>
<body>
  <!-- 苹果风格导航栏容器 -->
  <div class="nav-container">
    <nav>
      <div class="logo">Vertora</div>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Service</a>
        <a href="#">Blog</a>
        <a href="#">Portfolio</a>
        <a href="#">Contact</a>
      </div>
      <div class="menu-icon">☰</div>
    </nav>
  </div>

  <div class="hero-section">
    <div class="hero">
      <span class="left">Personal</span>
      <span class="right">Works</span>
    </div>

    <div class="sub-title">个人作品集</div>

    <div class="gallery-container">
      <div class="gallery">
        <div class="card"><img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=800" alt=""></div>
        <div class="card"><img src="https://images.unsplash.com/photo-1553356084-58ef4a67b2a7?w=800" alt=""></div>
        <div class="card"><img src="https://images.unsplash.com/photo-1511671782779-cb56e135bd67?w=800" alt=""></div>
        <div class="card"><img src="https://images.unsplash.com/photo-1557683316-973673baf926?w=800" alt=""></div>
        <div class="card"><img src="https://images.unsplash.com/photo-1557683311-e973673baf926?w=800" alt=""></div>
      </div>
    </div>
  </div>

  <!-- 品牌区：文字靠右水平齐平，滚动在下方 -->
  <section class="clients-section">
    <div class="partners-text-wrapper">
      <div class="partners-text">
  <small>OUR PARTNERS</small>
  <span class="main-desc">We collaborate with forward thinking brands to build lasting creative impact</span>
</div>
    </div>

    <div class="marquee-wrapper">
      <div class="marquee-track">
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="SAVANNAH"></div>
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="oslo."></div>
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="Basel"></div>
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="Manila."></div>
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="Cactus"></div>
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="FeatherDev"></div>
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="SAVANNAH"></div>
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="oslo."></div>
        <!-- 复制一倍实现无缝循环 -->
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="SAVANNAH"></div>
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="oslo."></div>
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="Basel"></div>
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="Manila."></div>
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="Cactus"></div>
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="FeatherDev"></div>
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="SAVANNAH"></div>
        <div class="marquee-item"><img src="https://img.adons.top/sucai/67fdfed1d4387726dad284e9_fake-company-logo-3.svg" alt="oslo."></div>
      </div>
    </div>
  </section>

  <script>
    const gallery = document.querySelector('.gallery');
    const hero = document.querySelector('.hero');
    const cards = document.querySelectorAll('.card');
    const clientsSection = document.querySelector('.clients-section');

    function forceReset() {
      cards.forEach(card => {
        card.style.transition = 'none';
        card.style.opacity = '0';
        card.style.transform = 'translateY(-180vh) translateX(0) rotate(0deg) scale(0.85)';
        card.offsetHeight;
      });
      hero.style.transition = 'none';
      hero.classList.remove('expand-title');
      hero.offsetHeight;
      hero.style.transition = '';
    }

    function startAnimation() {
      forceReset();

      setTimeout(() => {
        cards.forEach((card, index) => {
          setTimeout(() => {
            card.style.transition = 'all 1.2s cubic-bezier(0.34, 0.16, 0.3, 1)';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0) translateX(0) rotate(0deg) scale(1)';
          }, index * 120);
        });
        hero.classList.add('expand-title');
      }, 300);

      setTimeout(() => {
        cards.forEach((card, index) => {
          const rotations = [-22, -11, 0, 11, 22];
          const z = [-25, -12, 0, -12, -25];
          card.style.transition = 'all 1.4s cubic-bezier(0.34, 0.16, 0.3, 1)';
          card.style.transform = `translateY(0) rotate(${rotations[index]}deg) scale(0.96) translateZ(${z[index]}px)`;
        });
      }, 300 + 5 * 120 + 1200 + 500);

      setTimeout(() => {
        cards.forEach(card => {
          card.style.transition = 'all 1.4s cubic-bezier(0.34, 0.16, 0.3, 1)';
          card.style.transform = 'translateY(0) translateX(0) rotate(0deg) scale(1)';
        });
      }, 300 + 5 * 120 + 1200 + 500 + 4000);

      setTimeout(() => {
        cards.forEach((card, index) => {
          setTimeout(() => {
            card.style.transition = 'all 1.2s cubic-bezier(0.34, 0.16, 0.3, 1)';
            card.style.opacity = '0';
            card.style.transform = 'translateY(-180vh) translateX(0) rotate(0deg) scale(0.85)';
          }, index * 120);
        });
        hero.classList.remove('expand-title');
      }, 300 + 5 * 120 + 1200 + 500 + 4000 + 1400);

      setTimeout(forceReset, 300 + 5 * 120 + 1200 + 500 + 4000 + 1400 + 5 * 120 + 1000);
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.2 });

    observer.observe(clientsSection);

    startAnimation();
    setInterval(startAnimation, 13000);
  </script>
</body>
</html>
