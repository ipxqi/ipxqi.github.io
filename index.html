<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能加人物</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; 
            overflow: hidden; 
            background: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
        }
        .background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
        }
        .layer {
            position: absolute;
            width: 200%; height: 200%;
            background: radial-gradient(circle at center, transparent 0%, #ff5c7a22 30%, transparent 60%);
            filter: blur(80px);
            mix-blend-mode: screen;
            animation: flow linear infinite;
        }
        .layer1 { 
            background: radial-gradient(circle at center, transparent 0%, #ff5c7a33 30%, transparent 60%);
            animation-duration: 40s;
            top: -50%; left: -50%;
        }
        .layer2 { 
            background: radial-gradient(circle at center, transparent 0%, #8a5cff33 30%, transparent 60%);
            animation-duration: 50s;
            animation-direction: reverse;
            top: -30%; right: -50%;
        }
        .layer3 { 
            background: radial-gradient(circle at center, transparent 0%, #00ffd133 30%, transparent 60%);
            animation-duration: 45s;
            bottom: -40%; left: -30%;
        }
        .layer4 { 
            background: radial-gradient(circle at center, transparent 0%, #ffff0033 30%, transparent 60%);
            animation-duration: 55s;
            animation-direction: reverse;
            top: 0; right: -40%;
        }
        @keyframes flow {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(50vw, 50vh) rotate(360deg); }
        }
        .content { 
            position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px; 
        }
        h1 { font-size: 48px; font-weight: 600; margin-bottom: 20px; text-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        p { font-size: 24px; max-width: 800px; line-height: 1.6; opacity: 0.9; }
        a.button { display: inline-block; margin-top: 40px; padding: 16px 32px; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border-radius: 50px; color: white; text-decoration: none; font-size: 20px; font-weight: bold; box-shadow: 0 8px 32px rgba(0,0,0,0.4); transition: all 0.3s ease; }
        a.button:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-4px); }
    </style>
</head>
<body>
    <div class="background">
        <div class="layer layer1"></div>
        <div class="layer layer2"></div>
        <div class="layer layer3"></div>
        <div class="layer layer4"></div>
    </div>
    <div class="content">
        <h1>AI智能加人物<br>多角度展示</h1>
        <p>专业室内设计效果图 · 无人场景快速添加真实人物<br>支持任意人数、自然姿势、多角度呈现</p>
        <a href="/ai.html" class="button">查看作品集 →</a>
    </div>
</body>
</html>
