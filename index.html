<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能加人物</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        #vanta-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .content { position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px; }
        h1 { font-size: 48px; font-weight: 600; margin-bottom: 20px; text-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        p { font-size: 24px; max-width: 800px; line-height: 1.6; opacity: 0.9; }
        a.button { display: inline-block; margin-top: 40px; padding: 16px 32px; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border-radius: 50px; color: white; text-decoration: none; font-size: 20px; font-weight: bold; box-shadow: 0 8px 32px rgba(0,0,0,0.4); transition: all 0.3s ease; }
        a.button:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-4px); }
    </style>
</head>
<body>
    <div id="vanta-bg"></div>
    <div class="content">
        <h1>AI智能加人物<br>多角度展示</h1>
        <p>专业室内设计效果图 · 无人场景快速添加真实人物<br>支持任意人数、自然姿势、多角度呈现</p>
        <a href="/ai.html" class="button">查看作品集 →</a>
    </div>

    <!-- Vanta.js CDN + Three.js（Vanta 自动加载 Three.js，无需单独引入） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.net.min.js"></script>
    <script>
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 100.00,
            minWidth: 100.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x8a5cff,       // 主色调（紫色，可改）
            backgroundColor: 0x000000,
            points: 12.00,          // 点数量
            maxDistance: 20.00,     // 连线距离
            spacing: 16.00          // 点间距
        })
    </script>
</body>
</html>
