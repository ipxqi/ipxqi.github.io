<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能加人物</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        .background {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px); /* 大模糊产生流动弯曲感 */
            opacity: 0.7;
            mix-blend-mode: screen; /* 关键：颜色像光一样混合流动 */
            animation: float linear infinite;
        }
        /* 5个不同颜色+大小+速度的流动球体 */
        .orb1 { width: 800px; height: 800px; background: radial-gradient(circle, #ff5c7a 0%, transparent 70%); animation-duration: 30s; top: -200px; left: -200px; }
        .orb2 { width: 600px; height: 600px; background: radial-gradient(circle, #8a5cff 0%, transparent 70%); animation-duration: 40s; top: 20%; right: -100px; animation-direction: reverse; }
        .orb3 { width: 700px; height: 700px; background: radial-gradient(circle, #00ffd1 0%, transparent 70%); animation-duration: 35s; bottom: -150px; left: 10%; }
        .orb4 { width: 900px; height: 900px; background: radial-gradient(circle, #ffff00 0%, transparent 70%); animation-duration: 45s; top: 10%; left: -300px; animation-direction: reverse; }
        .orb5 { width: 500px; height: 500px; background: radial-gradient(circle, #ff8c00 0%, transparent 70%); animation-duration: 25s; bottom: 0; right: -200px; }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(100vw, 100vh) rotate(360deg); }
        }

        /* 鼠标跟随的光球（交互变形感） */
        .orb-mouse {
            position: absolute;
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
            filter: blur(80px);
            opacity: 0.6;
            pointer-events: none;
            mix-blend-mode: screen;
            transition: transform 0.2s ease-out;
            transform: translate(-50%, -50%);
        }

        .content { 
            position: relative; z-index: 1; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 20px; 
        }
        h1 { font-size: 48px; font-weight: 600; margin-bottom: 20px; text-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        p { font-size: 24px; max-width: 800px; line-height: 1.6; opacity: 0.9; }
        a.button { display: inline-block; margin-top: 40px; padding: 16px 32px; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border-radius: 50px; color: white; text-decoration: none; font-size: 20px; font-weight: bold; box-shadow: 0 8px 32px rgba(0,0,0,0.4); transition: all 0.3s ease; }
        a.button:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-4px); }
    </style>
</head>
<body>
    <div class="background">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
        <div class="orb orb4"></div>
        <div class="orb orb5"></div>
        <div class="orb orb-mouse" id="mouse-orb"></div>
    </div>
    <div class="content">
        <h1>AI智能加人物<br>多角度展示</h1>
        <p>专业室内设计效果图 · 无人场景快速添加真实人物<br>支持任意人数、自然姿势、多角度呈现</p>
        <a href="/ai.html" class="button">查看作品集 →</a>
    </div>

    <script>
        // 鼠标跟随光球
        const mouseOrb = document.getElementById('mouse-orb');
        document.addEventListener('mousemove', (e) => {
            mouseOrb.style.left = e.clientX + 'px';
            mouseOrb.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
