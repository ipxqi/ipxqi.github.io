<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link rel="shortcut icon" href="/favicon.png" type="image/png">

    <style>
        body {
            margin: 0 auto;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            touch-action: pan-x;
            max-width: 1440px;
            width: 100%;
            box-sizing: border-box;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        *::-webkit-scrollbar {
            display: none;
        }
        .header {
            padding: 80px 60px 60px 60px;
            width: 100%;
            box-sizing: border-box;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 500;
            margin: 0;
            line-height: 1.4;
            text-align: left;
        }
        .gallery-container {
            overflow: visible;
            padding: 0 60px 140px 60px;
            width: 100%;
            box-sizing: border-box;
            flex: 1;
            position: relative;
        }
        .gallery {
            display: flex;
            gap: 20px;
            transition: transform 0.8s cubic-bezier(0.34, 0.68, 0.15, 1);
            width: fit-content;
            min-width: 100%;
        }
        .card-wrapper {
            flex: 0 0 327px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            width: 327px;
            height: 450px;
            background-size: cover;
            background-position: center;
            border-radius: 28px;
            overflow: hidden;
            background-color: rgba(40, 40, 40, 0.6);
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
            color: #ffffff;
            text-align: left;
        }
        .card-desc {
            font-size: 15px;
            line-height: 1.6;
            color: #ddd;
            margin: 8px 0 0 0;
            text-align: left;
        }
        /* 箭头按钮 - 跟随卡片区域移动 */
        .nav-buttons {
            position: absolute;
            right: 0;
            top: -10%;
            transform: translateY(-50%);
            display: flex;
            gap: 20px;
            z-index: 1000;
            pointer-events: auto;
        }
        .nav-buttons button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-buttons button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }
        .nav-buttons button:disabled {
            background: rgba(255, 255, 255, 0.08);
            opacity: 0.4;
            cursor: default;
            transform: none;
        }

        /* ==================== 视频版块 ==================== */
        .video-section {
            padding: 0 60px 140px 60px;
            width: 100%;
            box-sizing: border-box;
        }
        .video-section h2 {
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 60px;
            text-align: left;
        }
        .video-gallery {
            display: flex;
            gap: 20px;
            transition: transform 0.8s cubic-bezier(0.34, 0.68, 0.15, 1);
            width: fit-content;
        }
        .video-card-wrapper {
            flex: 0 0 327px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .video-card {
            width: 450px;
            height: 280px;
            background-size: cover;
            background-position: center;
            border-radius: 28px;
            overflow: hidden;
            background-color: rgba(40, 40, 40, 0.6);
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
            position: relative;
            cursor: pointer;
        }
        .video-card::after {
            content: '▶';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            color: rgba(255,255,255,0.9);
            opacity: 0.85;
            transition: all 0.3s ease;
            z-index: 2;
        }
        .video-card:hover::after {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.15);
        }
        .video-card-title {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
            color: #ffffff;
            text-align: left;
        }
        .video-card-desc {
            font-size: 15px;
            line-height: 1.6;
            color: #ddd;
            margin: 8px 0 0 0;
            text-align: left;
        }

        @media (max-width: 1024px) {
            .header { padding: 40px 30px 20px; }
            .header h1 { font-size: 28px; }
            .gallery-container, .video-section {
                padding: 0 20px 140px 50px;
                overflow: hidden;
            }
            .gallery, .video-gallery { gap: 15px; }
            .card-wrapper, .video-card-wrapper { flex: 0 0 260px; }
            .card, .video-card { width: 260px; height: 314px; }
            .nav-buttons {
                position: fixed;
                bottom: 30px;
                right: 30px;
                top: auto;
                transform: none;
            }
            .nav-buttons button {
                width: 50px;
                height: 50px;
                font-size: 22px;
            }
        }
    </style>
</head>

    <script>
        // ==================== 原有图片滑动逻辑（完全不变） ====================
        const galleryContainer = document.querySelector('.gallery-container');
        const gallery = document.getElementById('gallery');
        const items = document.querySelectorAll('.card-wrapper');
        const total = items.length;
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        let maxIndex = total - Math.floor(galleryContainer.offsetWidth / (327 + 20));
        if (maxIndex < 0) maxIndex = 0;
        let index = 0;

        function updateSlide() {
            if (items.length === 0) return;
            const itemWidth = items[0].getBoundingClientRect().width;
            const gap = 20;
            const totalWidth = itemWidth + gap;
            let offset = index * totalWidth;
            if (window.innerWidth > 1024) {
                if (index === 0) offset = 0;
            } else {
                offset = index * (itemWidth + 15) + 20;
                if (index === 0) {
                    gallery.style.transform = `translateX(-20px)`;
                    return;
                }
            }
            gallery.style.transform = `translateX(-${offset}px)`;
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index >= maxIndex;
        }

        nextBtn.onclick = () => {
            if (index < maxIndex) {
                index++;
                updateSlide();
            }
        };
        prevBtn.onclick = () => {
            if (index > 0) {
                index--;
                updateSlide();
            }
        };

        window.addEventListener('resize', () => {
            const visible = Math.floor(galleryContainer.offsetWidth / (window.innerWidth > 1024 ? 347 : 275));
            maxIndex = total - visible;
            if (maxIndex < 0) maxIndex = 0;
            if (index > maxIndex) index = maxIndex;
            updateSlide();
        });

        updateSlide();

        // 触屏滑动支持
        let touchStartX = 0;
        let isSwiping = false;
        galleryContainer.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            isSwiping = true;
        }, { passive: false });

        galleryContainer.addEventListener('touchmove', (e) => {
            if (!isSwiping) return;
            const deltaX = e.touches[0].clientX - touchStartX;
            const currentOffset = index * (items[0].getBoundingClientRect().width + 15);
            gallery.style.transition = 'none';
            gallery.style.transform = `translateX(${ -currentOffset + deltaX }px)`;
            e.preventDefault();
        }, { passive: false });

        galleryContainer.addEventListener('touchend', () => {
            if (!isSwiping) return;
            const deltaX = event.changedTouches[0].clientX - touchStartX;
            gallery.style.transition = 'transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            if (Math.abs(deltaX) > 50) {
                if (deltaX > 0 && index > 0) index--;
                else if (deltaX < 0 && index < maxIndex) index++;
            }
            updateSlide();
            isSwiping = false;
        });
    </script>
