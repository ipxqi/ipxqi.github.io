<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="shortcut icon" href="/favicon.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AI智能加人物</title>
    <style>
        body {
            margin: 0 auto;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 1440px;
            width: 100%;
            box-sizing: border-box;
            overflow-x: hidden;
        }
        *::-webkit-scrollbar { display: none; }

        @media (max-width: 1024px) {
            body { touch-action: pan-y; }
            .gallery { touch-action: pan-y; }
        }

        .header {
            padding: 60px 60px 40px 60px;
            width: 100%;
            box-sizing: border-box;
        }
        .header h1 {
            font-size: 32px;
            font-weight: 500;
            margin: 0;
            line-height: 1.4;
        }

        .gallery-container {
            padding: 0 60px 100px 60px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }
        .gallery {
            display: flex;
            gap: 20px;
            transition: transform 0.8s cubic-bezier(0.34, 0.68, 0.15, 1);
            width: fit-content;
        }
        .card-wrapper {
            flex: 0 0 327px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            width: 327px;
            height: 450px;
            background-size: cover;
            background-position: center;
            border-radius: 28px;
            overflow: hidden;
            background-color: rgba(40, 40, 40, 0.6);
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
            color: #ffffff;
        }
        .card-desc {
            font-size: 15px;
            line-height: 1.6;
            color: #ddd;
            margin: 8px 0 0 0;
        }

        .nav-buttons {
            position: absolute;
            right: 60px;
            top: -10%;
            transform: translateY(-50%);
            display: flex;
            gap: 20px;
            z-index: 1000;
        }
        .nav-buttons button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(20px);
        }
        .nav-buttons button:hover { background: rgba(255,255,255,0.3); }
        .nav-buttons button:disabled { opacity: 0.4; cursor: default; }

        /* ==================== 手机端调整 ==================== */
        @media (max-width: 1024px) {
            .header { padding: 50px 20px 30px 20px; }
            .header h1 { font-size: 28px; }
            
            .gallery-container {
                padding: 0 20px 100px 20px;
            }
            .card-wrapper, .video-card-wrapper { flex: 0 0 260px; }
            .card, .video-card { width: 260px; height: 314px; }

            /* 箭头放在卡片下方并向右对齐 */
            .nav-buttons {
                position: relative;
                top: auto;
                right: 0;
                margin: 15px 0 30px auto;   /* 向右对齐 */
                transform: none;
                justify-content: flex-end;
                width: 100%;
                padding-right: 10px;
            }
            .nav-buttons button {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }
        }

        /* 视频部分 */
        .video-section {
            padding: 80px 60px 140px 60px;
            background: #1d1d1f;
            margin: 0 -60px;
        }
        .video-section h2 {
            font-size: 32px;
            font-weight: 500;
            margin-bottom: 60px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>无人场景加多人<br>多角度展示</h1>
    </div>

    <div class="gallery-container">
        <div class="gallery" id="gallery">
            <a href="detail.html?scene=1" style="text-decoration: none; color: inherit;">
                <div class="card-wrapper">
                    <div class="card" style="background-image: url('https://img.adons.top/01/1.jpg');"></div>
                    <div><div class="card-title">场景一</div><div class="card-desc">完美呈现家庭生活场景<br>食物细节丰富、氛围温馨</div></div>
                </div>
            </a>
            <a href="detail.html?scene=2" style="text-decoration: none; color: inherit;">
                <div class="card-wrapper">
                    <div class="card" style="background-image: url('https://img.adons.top/02/2-1.jpg');"></div>
                    <div><div class="card-title">场景二</div><div class="card-desc">情侣相对而坐共享晚餐<br>姿态放松、表情生动真实</div></div>
                </div>
            </a>
            <a href="detail.html?scene=3" style="text-decoration: none; color: inherit;">
                <div class="card-wrapper">
                    <div class="card" style="background-image: url('https://img.adons.top/03/1.jfif');"></div>
                    <div><div class="card-title">场景三</div><div class="card-desc">完美呈现友情温暖的日常时光<br>每个人动作协调、表情自然</div></div>
                </div>
            </a>
            <a href="detail.html?scene=4" style="text-decoration: none; color: inherit;">
                <div class="card-wrapper">
                    <div class="card" style="background-image: url('https://img.adons.top/04/1.jfif');"></div>
                    <div><div class="card-title">场景四</div><div class="card-desc">调酒师微笑递酒、女士顾客专注品尝<br>空间感强、细节真实无违和</div></div>
                </div>
            </a>
            <a href="detail.html?scene=5" style="text-decoration: none; color: inherit;">
                <div class="card-wrapper">
                    <div class="card" style="background-image: url('https://img.adons.top/05/1.jpg');"></div>
                    <div><div class="card-title">场景五</div><div class="card-desc">朋友围坐茶桌闲聊时光<br>友情温暖瞬间，日常温馨动人</div></div>
                </div>
            </a>
            <a href="detail.html?scene=6" style="text-decoration: none; color: inherit;">
                <div class="card-wrapper">
                    <div class="card" style="background-image: url('https://img.adons.top/06/1.jpg');"></div>
                    <div><div class="card-title">场景六</div><div class="card-desc">母子阳台玩乐温馨时光<br>家庭亲子瞬间，孩子专注玩耍</div></div>
                </div>
            </a>
            <a href="detail.html?scene=7" style="text-decoration: none; color: inherit;">
                <div class="card-wrapper">
                    <div class="card" style="background-image: url('https://img.adons.top/07/1.jpg');"></div>
                    <div><div class="card-title">场景七</div><div class="card-desc">商务聚会轻松用餐氛围<br>人物姿态优雅、互动自然</div></div>
                </div>
            </a>
        </div>

        <div class="nav-buttons">
            <button id="prev-btn">❮</button>
            <button id="next-btn">❯</button>
        </div>
    </div>

    <div class="video-section">
        <h2>AI智能视频展示</h2>
        <div class="gallery">
            <div class="video-card-wrapper" onclick="playVideo('https://pub-c82e30e0463848b68595368687744f81.r2.dev/SwivelChair.mp4')">
                <div class="video-card" style="background-image: url('https://pub-c82e30e0463848b68595368687744f81.r2.dev/SwivelChair.jpg');"></div>
                <div>
                    <div class="video-card-title">Olivia Velvet Swivel Chair</div>
                    <div class="video-card-desc">旋转椅 AI 智能加人物演示 - 自然动作与多角度展示</div>
                </div>
            </div>
        </div>
    </div>

    <div id="videoModal" class="video-modal">
        <div class="video-modal-content">
            <div class="video-modal-close" onclick="closeVideo()">×</div>
            <div id="loading" class="loading" style="display:none;">加载中...</div>
            <video id="modalVideo" controls autoplay playsinline>
                <source id="modalSource" src="" type="video/mp4">
            </video>
        </div>
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const items = document.querySelectorAll('.card-wrapper');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        let index = 0;

        function getVisibleCount() {
            return window.innerWidth > 1024 ? 3 : 1;
        }

        function updateSlide() {
            const itemWidth = items[0].getBoundingClientRect().width + 20;
            gallery.style.transform = `translateX(-${index * itemWidth}px)`;
            const visible = getVisibleCount();
            prevBtn.disabled = index === 0;
            nextBtn.disabled = index >= items.length - visible;
        }

        nextBtn.onclick = () => { const v = getVisibleCount(); if (index < items.length - v) { index++; updateSlide(); } };
        prevBtn.onclick = () => { if (index > 0) { index--; updateSlide(); } };

        window.addEventListener('resize', updateSlide);
        updateSlide();

        // 手机触屏滑动
        let touchStartX = 0, touchStartY = 0;
        const container = document.querySelector('.gallery-container');
        container.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        container.addEventListener('touchmove', e => {
            const deltaX = Math.abs(e.touches[0].clientX - touchStartX);
            const deltaY = Math.abs(e.touches[0].clientY - touchStartY);
            if (deltaX > deltaY + 20) e.preventDefault();
        }, { passive: false });

        // 视频播放
        function playVideo(videoUrl) {
            const modal = document.getElementById('videoModal');
            const source = document.getElementById('modalSource');
            const video = document.getElementById('modalVideo');
            const loading = document.getElementById('loading');
            source.src = videoUrl;
            video.load();
            loading.style.display = 'block';
            modal.style.display = 'flex';
            video.onloadeddata = () => { loading.style.display = 'none'; video.play().catch(() => {}); };
            video.onerror = () => { loading.style.display = 'none'; alert('视频加载失败'); };
        }
        function closeVideo() {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('modalVideo');
            video.pause();
            video.currentTime = 0;
            modal.style.display = 'none';
        }
        document.getElementById('videoModal').addEventListener('click', function(e) {
            if (e.target === this) closeVideo();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape") closeVideo();
        });
    </script>
</body>
</html>
