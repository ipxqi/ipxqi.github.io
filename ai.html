    <style>
        body {
            margin: 0 auto;
            padding: 0;

            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 1440px;
            width: 100%;

        }

            body { touch-action: pan-y; }

        /* ==================== 统一标题样式 ==================== */
.header h1,
.video-section h2 {
    font-size: 32px;
    font-weight: 500;
    margin: 0;
    line-height: 1.4;
    color: #fff;
}

/* 手机端标题大小调整 */
@media (max-width: 1024px) {
    .header h1,
    .video-section h2 {
        font-size: 28px;
    }
}

        .gallery-container {
            padding: 0 60px 100px 60px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
        }
        .gallery {
            display: flex;
            gap: 20px;
            transition: transform 0.8s cubic-bezier(0.34, 0.68, 0.15, 1);
            width: fit-content;
        }
        .card-wrapper {
            flex: 0 0 327px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            width: 327px;
            height: 450px;
            background-size: cover;
            background-position: center;
            border-radius: 28px;
            overflow: hidden;

        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
            color: #ffffff;
        }
        .card-desc {
            font-size: 15px;
            line-height: 1.6;
            color: #ddd;
            margin: 8px 0 0 0;
        }

        .nav-buttons {
            position: absolute;
            right: 60px;
            top: -10%;
            transform: translateY(-50%);
            display: flex;
            gap: 20px;
            z-index: 1000;
        }
        .nav-buttons button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(20px);
        }
        .nav-buttons button:hover { background: rgba(255,255,255,0.3); }
        .nav-buttons button:disabled { opacity: 0.4; cursor: default; }

        /* ==================== 手机端调整 ==================== */
        @media (max-width: 1024px) {
            .header { padding: 50px 20px 30px 20px; }
            .header h1 { font-size: 28px; }
            
            .gallery-container {
                padding: 0 20px 0px 20px;
            }
            .card-wrapper, .video-card-wrapper { flex: 0 0 260px; }
            .card, .video-card { width: 260px; height: 314px; }

            .nav-buttons {
                position: relative;
                top: auto;
                right: 0;

        /* 视频部分 */

            padding: 80px 60px 140px 60px;
            background: #1d1d1f;

            font-size: 32px;
            font-weight: 500;

/* ==================== 视频展示 - 手机端竖排版 ==================== */
/* ==================== 视频区域：背景铺满 + 手机端居中 ==================== */
.video-section {
    width: 100%;
    background: #1d1d1f;
    padding: 60px 0 140px 0;
    margin: 0;
    position: relative;
}

.video-section::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    right: 50%;
    bottom: 0;
    background: #1d1d1f;
    z-index: -1;
    margin-left: -50vw;
    margin-right: -50vw;
}

.video-inner {
    max-width: 1440px;
    margin: 0 auto;
    padding: 0 60px;
    width: 100%;
    box-sizing: border-box;
}

.video-section h2 {
    font-size: 32px;
    font-weight: 500;
    margin-bottom: 50px;
    padding-left: 10px;
    color: #fff;
}

.video-gallery {
    display: flex;
    flex-direction: row;
    gap: 24px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 30px;
    scrollbar-width: none;
}

.video-gallery::-webkit-scrollbar {
    display: none;
}

.video-card {
    flex: 0 0 390px;
    scroll-snap-align: start;
    background: transparent;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.video-card:hover {
    transform: scale(1.03);
}

.thumbnail {
    position: relative;
    width: 100%;
    height: 240px;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.play-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 72px;
    height: 72px;
    background: rgba(255, 255, 255, 0.95);
    color: #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    transition: all 0.3s ease;
}

.video-card:hover .play-icon {
    transform: translate(-50%, -50%) scale(1.12);
    background: #fff;
}

.info {
    padding: 18px 6px 10px;
}

.title {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 0px 0;
    color: #fff;
}

.desc {
    font-size: 15px;
    line-height: 1.6;
    color: #ccc;
}

/* ==================== 手机端：竖排 + 居中 ==================== */
@media (max-width: 1024px) {
    .video-section {
        padding: 60px 0 100px 0;
    }
    
    .video-inner {
        padding: 0 20px;
    }
    
    .video-gallery {
        flex-direction: column;
        align-items: center;     /* 关键：卡片水平居中 */
        gap: 32px;
        overflow-x: visible;
        padding-bottom: 0;
    }
    
    .video-card {
        flex: none;
        width: 100%;
        max-width: 420px;        /* 限制最大宽度，避免手机上太宽 */
    }
    
    .thumbnail {
        height: 260px;
        border-radius: 20px;
    }
    
    .play-icon {
        width: 68px;
        height: 68px;
        font-size: 34px;
    }
}

/* ==================== 视频弹窗浮层（居中弹出） ==================== */
.video-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.94);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
}

.video-modal-content {
    position: relative;
    width: 100%;
    max-width: 960px;
    background: #000;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 30px 100px rgba(0,0,0,0.9);
}

.video-modal-close {
    position: absolute;
    top: 18px;
    right: 18px;
    font-size: 34px;
    color: #fff;
    cursor: pointer;
    z-index: 10000;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
}

#modalVideo {
    width: 100%;
    display: block;
    max-height: 88vh;
}

.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 18px;
}
        
    </style>
</head>

<!-- 视频部分 -->
<div class="video-section">

            <!-- 示例卡片（可复制添加更多） -->

                <div class="thumbnail">

    <!-- 视频弹窗 -->
    <div id="videoModal" class="video-modal">
        <div class="video-modal-content">
            <div class="video-modal-close" onclick="closeVideo()">×</div>
            <div id="loading" class="loading">加载中...</div>
            <video id="modalVideo" controls autoplay playsinline>
                <source id="modalSource" src="" type="video/mp4">
            </video>
        </div>
    </div>
    

 <script>
    // 场景画廊滑动功能（保持不变）
    const gallery = document.getElementById('gallery');
    const items = document.querySelectorAll('.card-wrapper');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    let index = 0;

    function getVisibleCount() {
        return window.innerWidth > 1024 ? 3 : 1;
    }

    function updateSlide() {
        const itemWidth = items[0].getBoundingClientRect().width + 20;
        gallery.style.transform = `translateX(-${index * itemWidth}px)`;
        const visible = getVisibleCount();
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index >= items.length - visible;
    }

    nextBtn.onclick = () => { 
        const v = getVisibleCount(); 
        if (index < items.length - v) { index++; updateSlide(); } 
    };
    prevBtn.onclick = () => { 
        if (index > 0) { index--; updateSlide(); } 
    };

    window.addEventListener('resize', updateSlide);
    updateSlide();

    // 手机端触屏滑动（保持不变）
    let touchStartX = 0, touchStartY = 0;
    let isSwiping = false;
    gallery.addEventListener('touchstart', e => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        isSwiping = true;
    }, { passive: true });

    gallery.addEventListener('touchmove', e => {
        if (!isSwiping) return;
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy)) {
            e.preventDefault();
            const itemWidth = items[0].getBoundingClientRect().width + 20;
            gallery.style.transition = 'none';
            gallery.style.transform = `translateX(${-index * itemWidth + dx}px)`;
        }
    }, { passive: false });

    gallery.addEventListener('touchend', e => {
        if (!isSwiping) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) {
            const visible = getVisibleCount();
            if (dx < 0 && index < items.length - visible) index++;
            if (dx > 0 && index > 0) index--;
        }
        const itemWidth = items[0].getBoundingClientRect().width + 20;
        gallery.style.transition = 'transform 0.8s cubic-bezier(0.34, 0.68, 0.15, 1)';
        gallery.style.transform = `translateX(-${index * itemWidth}px)`;
        isSwiping = false;
    });

    // ==================== 修复版：点击视频卡片直接全屏播放 + 关闭按钮 ====================
    document.addEventListener('DOMContentLoaded', function() {
        const videoCards = document.querySelectorAll('.video-card');
        
        videoCards.forEach(card => {
            card.addEventListener('click', function() {
                const videoUrl = this.getAttribute('data-video');
                if (!videoUrl) return;

                // 创建全屏视频容器
                const videoContainer = document.createElement('div');
                videoContainer.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: #000;
                    z-index: 9999;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                `;

                // 创建视频元素
                const tempVideo = document.createElement('video');
                tempVideo.src = videoUrl;
                tempVideo.controls = true;
                tempVideo.autoplay = true;
                tempVideo.playsInline = true;
                tempVideo.style.cssText = `
                    width: 100%;
                    height: 100%;
                    max-height: 100vh;
                    object-fit: contain;
                `;

                // 创建关闭按钮
                const closeBtn = document.createElement('div');
                closeBtn.innerHTML = '✕';
                closeBtn.style.cssText = `
                    position: absolute;
                    top: 30px;
                    right: 30px;
                    font-size: 36px;
                    color: #fff;
                    cursor: pointer;
                    z-index: 10000;
                    width: 50px;
                    height: 50px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: rgba(0,0,0,0.6);
                    border-radius: 50%;
                    user-select: none;
                `;

                // 组装元素
                videoContainer.appendChild(tempVideo);
                videoContainer.appendChild(closeBtn);
                document.body.appendChild(videoContainer);

                // 播放视频
                tempVideo.play().catch(err => {
                    console.error('播放失败:', err);
                    alert('视频播放失败，请稍后重试');
                    document.body.removeChild(videoContainer);
                });

                // 关闭功能
                const closeVideo = () => {
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    }
                    if (videoContainer.parentNode) {
                        document.body.removeChild(videoContainer);
                    }
                };

                // 点击关闭按钮关闭
                closeBtn.addEventListener('click', closeVideo);

                // 视频播放结束自动关闭
                tempVideo.addEventListener('ended', closeVideo);

                // 全屏状态变化时处理
                tempVideo.addEventListener('fullscreenchange', () => {
                    if (!document.fullscreenElement) {
                        closeVideo();
                    }
                });
            });
        });
    });
</script>
