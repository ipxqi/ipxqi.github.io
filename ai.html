/* ==================== 视频展示 - 纯净版（按你的最新要求） ==================== */
.video-section {
    padding: 80px 60px 140px 60px;
    background: #1d1d1f;

.video-section h2 {
    font-size: 32px;
    font-weight: 500;

    padding-left: 10px;
    color: #fff;
}

.video-gallery {
    display: flex;
    gap: 24px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 30px;
    scrollbar-width: none;
}

.video-gallery::-webkit-scrollbar {
    display: none;
}

.video-card {
    flex: 0 0 340px;
    scroll-snap-align: start;
    background: transparent;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.video-card:hover {
    transform: scale(1.04);
}

.thumbnail {
    position: relative;
    width: 100%;
    height: 240px;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.play-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 72px;
    height: 72px;
    background: rgba(255, 255, 255, 0.95);
    color: #000;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    transition: all 0.3s ease;
    pointer-events: none;
}

.video-card:hover .play-icon {
    transform: translate(-50%, -50%) scale(1.12);
    background: rgba(255, 255, 255, 1);
}

.info {
    padding: 18px 6px 10px;
    text-align: left;
}

.title {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 8px 0;
    color: #fff;
}

.desc {
    font-size: 15px;
    line-height: 1.6;
    color: #ccc;
}

/* 手机端适配 */
@media (max-width: 1024px) {

}

/* ==================== 视频弹窗浮层（全屏居中弹出） ==================== */
.video-modal {

    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.92);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;

}

.video-modal-content {

    width: 100%;
    max-width: 960px;
    background: #000;
    border-radius: 20px;
    overflow: hidden;

}

.video-modal-close {

    top: 20px;
    right: 20px;
    font-size: 32px;
    color: #fff;
    cursor: pointer;
    z-index: 10000;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;
}

#modalVideo {

.loading {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 18px;
    z-index: 10;
}

    <script>
    const gallery = document.getElementById('gallery'); // 原本图片 gallery
const items = document.querySelectorAll('.card-wrapper');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
let index = 0;

function getVisibleCount() {
    return window.innerWidth > 1024 ? 3 : 1;
}

function updateSlide() {
    const itemWidth = items[0].getBoundingClientRect().width + 20;
    gallery.style.transform = `translateX(-${index * itemWidth}px)`;
    const visible = getVisibleCount();
    prevBtn.disabled = index === 0;
    nextBtn.disabled = index >= items.length - visible;
}

nextBtn.onclick = () => { const v = getVisibleCount(); if (index < items.length - v) { index++; updateSlide(); } };
prevBtn.onclick = () => { if (index > 0) { index--; updateSlide(); } };

window.addEventListener('resize', updateSlide);
updateSlide();

// ========= 手机触屏滑动卡片，只绑定到图片 gallery =========
let touchStartX = 0, touchStartY = 0;
let isSwiping = false;

gallery.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    isSwiping = true;
}, { passive: true });

gallery.addEventListener('touchmove', e => {
    if (!isSwiping) return;

    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;

    // 只有横向滑动时阻止默认滚动
    if (Math.abs(dx) > Math.abs(dy)) {
        e.preventDefault();
        const itemWidth = items[0].getBoundingClientRect().width + 20;
        gallery.style.transition = 'none';
        gallery.style.transform = `translateX(${-index * itemWidth + dx}px)`;
    }
}, { passive: false });

gallery.addEventListener('touchend', e => {
    if (!isSwiping) return;

    const dx = e.changedTouches[0].clientX - touchStartX;

    if (Math.abs(dx) > 50) {  // 滑动超过50px就切换
        const visible = getVisibleCount();
        if (dx < 0 && index < items.length - visible) index++;
        if (dx > 0 && index > 0) index--;
    }

    const itemWidth = items[0].getBoundingClientRect().width + 20;
    gallery.style.transition = 'transform 0.8s cubic-bezier(0.34, 0.68, 0.15, 1)';
    gallery.style.transform = `translateX(-${index * itemWidth}px)`;

    isSwiping = false;
});

      function playVideo(videoUrl) {
    const modal = document.getElementById('videoModal');
    const source = document.getElementById('modalSource');
    const video = document.getElementById('modalVideo');
    const loading = document.getElementById('loading');

    source.src = videoUrl;
    video.load();
    loading.style.display = 'block';
    modal.style.display = 'flex';
    
    video.onloadeddata = () => {
        loading.style.display = 'none';
        video.play().catch(() => {});
    };
    
    video.onerror = () => {
        loading.style.display = 'none';
        alert('视频加载失败');
    };
}

function closeVideo() {
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('modalVideo');
    video.pause();
    video.currentTime = 0;
    modal.style.display = 'none';
}
        document.getElementById('videoModal').addEventListener('click', function(e) {
            if (e.target === this) closeVideo();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === "Escape") closeVideo();
        });
    </script>
